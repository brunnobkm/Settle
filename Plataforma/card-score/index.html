<!doctype html>
<!--
  ============================================================================
  SETTLE — Propostas de evidência do Score / Checklist no card
  Comparação com 2 tabs (Score, Checklist), 3 modelos de card cada.
  Score e Checklist são produtos separados (vendidos por cliente): nunca
  coexistem. Cada modelo usa o card COMPLETO (metadados + itens) com o
  tratamento aplicado por cima.
  ============================================================================
-->
<html lang="pt-BR" data-preview="CARD-SCORE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settle — Propostas: Score e Checklist no card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../assets/settle.css" />

  <style>
    body{background:var(--muted);}
    .wrap{max-width:1460px;margin:0 auto;padding:28px 32px 90px;}

    /* tabs (usa .tabs/.tab do settle.css) */
    .tabbar{margin:0 0 22px;}
    .panel{display:none;}
    .panel.active{display:block;}
    /* espaçamento entre os cards */
    .proposal{margin-bottom:24px;}

    /* ===================== TEMPERATURA ===================== */
    .temp-frio{--tc:var(--destructive);--tbg:rgba(220,38,38,.1);}
    .temp-morno{--tc:var(--warning);--tbg:rgba(217,119,6,.1);}
    .temp-quente{--tc:var(--success);--tbg:rgba(22,163,74,.1);}
    .chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:16px;padding:2px 7px;border-radius:6px;background:var(--tbg);color:var(--tc);}

    /* ---- A1: chip de score na barra de ações ---- */
    .score-chip{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;height:32px;padding:0 12px;background:var(--tbg);color:var(--tc);font-size:14px;font-weight:600;white-space:nowrap;}
    .score-chip svg{width:16px;height:16px;}
    .score-chip .den{font-weight:500;opacity:.75;}
    .score-chip .sep-dot{opacity:.5;}

    /* ---- A2 / B2: caixa ao lado do cabeçalho (compacta, no canto direito) ---- */
    .lc-headrow{display:flex;gap:8px;align-items:flex-start;}
    .lc-headrow > .module{flex:1;min-width:0;}
    .score-mini{flex:none;width:261px;border:1px solid var(--border);border-radius:var(--radius-box);padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:14px;}
    .sm-head{display:flex;align-items:center;gap:14px;}
    .sm-ring{flex:none;position:relative;width:52px;height:52px;}
    .sm-ring .sm-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--tc);}
    .sm-info{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
    .sm-num{font-size:22px;font-weight:700;line-height:1;}
    .sm-num .den{font-size:13px;font-weight:500;color:var(--muted-foreground);}
    .sm-foot{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--border);}
    .sm-sub{font-size:13px;color:var(--muted-foreground);line-height:18px;}
    .sm-link{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;}

    /* ---- A3: módulo faixa de score no topo ---- */
    .score-band{display:flex;align-items:center;gap:20px;border:1px solid var(--border);border-radius:var(--radius-box);padding:12px 16px;background:var(--card);}
    .sb-ring{flex:none;position:relative;width:66px;height:66px;}
    .sb-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--tc);}
    .sb-ring .num b{font-size:20px;font-weight:700;}
    .sb-ring .num small{font-size:9px;font-weight:600;opacity:.7;margin-top:1px;}
    .sb-mid{flex:1;min-width:120px;}
    .sb-temp{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .sb-temp .muted{font-size:13px;color:var(--muted-foreground);}
    .sb-bar{height:8px;border-radius:9999px;background:var(--muted);overflow:hidden;}
    .sb-bar i{display:block;height:100%;border-radius:9999px;background:var(--tc);}
    .sb-rev{flex:none;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
    .sb-rev .muted{font-size:13px;color:var(--warning);font-weight:500;}

    /* ---- B1: botão de checklist na barra ---- */
    .checklist-entry{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--warning);background:var(--warning-bg);color:var(--warning);font-size:14px;font-weight:600;white-space:nowrap;}
    .checklist-entry svg{width:16px;height:16px;}
    .checklist-entry.ok{border-color:var(--success);background:rgba(22,163,74,.1);color:var(--success);width:32px;padding:0;justify-content:center;}
    .chip-rev{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:16px;padding:2px 7px;border-radius:6px;background:var(--warning-bg);color:var(--warning);}

    /* ---- B2: grade dos campos, agrupados por seção ---- */
    .checklist-mod{border:1px solid var(--border);border-radius:var(--radius-box);background:var(--card);}
    .clg-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
    .clg-head svg{width:16px;height:16px;color:var(--muted-foreground);}
    .clg-head b{font-size:15px;font-weight:600;}
    .clg-count{font-size:13px;color:var(--muted-foreground);}
    .clg-sec{padding:12px;}
    .clg-sec + .clg-sec{border-top:1px solid var(--border);}
    .clg-sec-title{font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
    .clg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 20px;}
    .cl-rev{color:var(--warning);font-weight:600;}

    /* ---- B3: checklist em acordeão por seção ---- */
    .checklist-acc{border:1px solid var(--border);border-radius:var(--radius-box);overflow:hidden;background:var(--card);}
    .ca-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
    .ca-head svg{width:16px;height:16px;color:var(--muted-foreground);}
    .ca-head b{font-size:15px;font-weight:600;}
    .ca-sec{border-top:1px solid var(--border);}
    .ca-sec:first-of-type{border-top:none;}
    .ca-sum{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-size:14px;font-weight:600;}
    .ca-sum::-webkit-details-marker{display:none;}
    .ca-count{font-size:12px;font-weight:500;color:var(--muted-foreground);}
    .ca-chev{margin-left:auto;color:var(--muted-foreground);transition:transform .15s;display:inline-flex;}
    .ca-sec[open] .ca-chev{transform:rotate(180deg);}
    .ca-body{padding:0 12px 6px;}
    .ca-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--border);font-size:14px;}
    .ca-row .k{color:var(--foreground);}
    .ca-row .v{color:var(--muted-foreground);}

    /* ---- B4: botão "Checklist" (na barra) com dropdown de lista ---- */
    .checklist-dd{position:relative;display:inline-block;}
    .cdd-trigger{list-style:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--warning);border-radius:8px;background:var(--warning-bg);color:var(--warning);cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;}
    .cdd-trigger::-webkit-details-marker{display:none;}
    .cdd-trigger svg{width:16px;height:16px;}
    .cdd-chev{transition:transform .15s;}
    .checklist-dd[open] .cdd-chev{transform:rotate(180deg);}
    .checklist-dd.ok .cdd-trigger{border-color:var(--success);background:rgba(22,163,74,.1);color:var(--success);}
    .cdd-panel{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:360px;max-width:calc(100vw - 60px);max-height:440px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-box);box-shadow:var(--shadow-pop);padding:8px;}
    .cdd-group{padding:2px 2px 8px;}
    .cdd-group + .cdd-group{border-top:1px solid var(--border);margin-top:4px;padding-top:8px;}
    .cdd-group-head{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;}
    .cdd-title{font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.03em;}
    .cdd-field{padding:6px 2px;font-size:14px;}
    .cdd-f-name{display:block;color:var(--foreground);}
    .cdd-f-val{display:block;color:var(--muted-foreground);margin-top:2px;}
    .cdd-field .cl-rev{display:block;margin-top:2px;}
    .cdd-full{width:100%;justify-content:center;margin-top:8px;}

    /* ---- carousel de variações de status ---- */
    .carousel{position:relative;}
    .carousel-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;}
    .car-prev,.car-next{width:28px;height:28px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--foreground);}
    .car-prev:hover,.car-next:hover{background:var(--muted);}
    .car-label{font-size:13px;font-weight:600;color:var(--muted-foreground);min-width:170px;text-align:center;}
    .carousel-slide[hidden]{display:none;}

    /* ---- A4 / B4: faixa no topo do MESMO card (não dois cards) ---- */
    .lic-card.has-banner{overflow:hidden;}
    .score-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--tbg);border-bottom:1px solid var(--border);}
    .score-banner.neutral{background:var(--muted);}
    .sbn-left{display:flex;align-items:center;gap:8px;color:var(--tc);font-size:18px;font-weight:700;line-height:1;}
    .score-banner.neutral .sbn-left{color:var(--foreground);}
    .sbn-left svg{width:20px;height:20px;}
    .sbn-left .den{font-weight:500;opacity:.7;font-size:15px;}
    .sbn-label{font-size:15px;font-weight:600;}
    .sbn-badge{background:var(--warning);color:var(--primary-foreground);font-size:13px;font-weight:600;padding:5px 12px;border-radius:8px;white-space:nowrap;}

    @media (max-width:900px){
      .lc-headrow{flex-direction:column;} .score-mini{width:100%;}
      .clg-grid{grid-template-columns:repeat(2,1fr);}
      .score-band{flex-wrap:wrap;} .sb-rev{text-align:left;align-items:flex-start;}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="tabbar">
      <div class="tabs" role="tablist">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="score">Score</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="checklist">Checklist</button>
      </div>
    </div>

    <section class="panel active" id="panel-score" role="tabpanel">
      <div id="scoreList"></div>
    </section>

    <section class="panel" id="panel-checklist" role="tabpanel">
      <div id="checklistList"></div>
    </section>
  </div>

  <script>
    const I = {
      gauge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>',
      doc:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 1.8h4L12 5.3v8.4a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V2.3a.5.5 0 0 1 .5-.5z"/><path d="M8.3 1.8V5.3H12M6 8h4M6 10.4h4"/></svg>',
      listChecks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
      refresh:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5.25A4.5 4.5 0 0 0 2.7 3.15L1.5 4.35M1.5 6.75a4.5 4.5 0 0 0 7.8 2.1l1.2-1.2"/><path d="M1.5 1.5v2.85h2.85M10.5 10.5V7.65H7.65"/></svg>',
      pencil:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3 2.7a1.4 1.4 0 0 1 2 2L5.5 12.5l-2.7.6.6-2.7z"/></svg>',
      person:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0z"/></svg>',
      bell:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5.2a3.2 3.2 0 0 0-6.4 0c0 3-1.3 4-1.3 4h9.6s-1.1-.8-1.3-3M6.8 12.5a1.4 1.4 0 0 0 2.4 0"/><circle cx="12" cy="3.6" r="1.7" fill="currentColor" stroke="none"/></svg>',
      bookmark:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h8a.5.5 0 0 1 .5.5v10.5l-4.5-2.6L3.5 13.5V3a.5.5 0 0 1 .5-.5z"/></svg>',
      link:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a2.4 2.4 0 0 0 3.4 0l2-2a2.4 2.4 0 0 0-3.4-3.4l-.9.9"/><path d="M9.5 6.5a2.4 2.4 0 0 0-3.4 0l-2 2a2.4 2.4 0 0 0 3.4 3.4l.9-.9"/></svg>',
      share:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.8"/><circle cx="4" cy="8" r="1.8"/><circle cx="12" cy="12" r="1.8"/><path d="M5.6 7.1 10.4 4.9M5.6 8.9l4.8 2.2"/></svg>',
      folder:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1 1 0 0 1 3 3.5h3l1.3 1.5H13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>'
    };

    const softIcons = `
      <button class="soft-ia" type="button" aria-label="Salvar">${I.bookmark}</button>
      <button class="soft-ia accent" type="button" aria-label="Copiar link">${I.link}</button>
      <button class="soft-ia" type="button" aria-label="Compartilhar">${I.share}</button>
      <button class="soft-ia" type="button" aria-label="Arquivos">${I.folder}</button>`;

    const avatars = `
      <span class="lc-avatars" aria-label="Responsáveis">
        <button class="lc-av add" type="button" aria-label="Adicionar responsável">+</button>
      </span>`;

    const topBar = (entry='') => `
      <div class="lc-top">
        <div class="lc-top-left">
          <button class="lc-chk" type="button" aria-label="Selecionar edital"></button>
          <span class="lc-title"><b>Edital</b> <span class="num">90001/2026</span></span>
        </div>
        <div class="lc-top-actions">
          <button class="btn btn-secondary" type="button">Descartar</button>
          <button class="btn btn-primary" type="button">Enviar para análise</button>
          <span class="vsep" aria-hidden="true"></span>
          ${avatars}
          <span class="vsep" aria-hidden="true"></span>
          ${softIcons}
          ${entry ? `<span class="vsep" aria-hidden="true"></span>${entry}` : ''}
        </div>
      </div>`;

    const headerInner = `
      <div class="lc-segments"><span class="seg">Segmento 1</span><span class="seg">Segmento 2</span></div>
      <div class="lc-org"><span><b>Órgão:</b> EPA - PROCURADORIA GERAL DO ESTADO DO PARÁ</span><span class="tag-light">ME - EPP</span></div>
      <p class="lc-obj"><b>Objeto:</b> Licitação para fornecimento de computadores desktop, notebooks, monitores e periféricos para atender a rede municipal de ensino. Inclui instalação, configuração e garantia de 36 meses com suporte on-site. Entrega em 47 unidades escolares.</p>
      <p class="lc-valor">Valor global: R$ 47.284.499,63</p>`;

    const header = () => `<div class="module">${headerInner}</div>`;
    /* caixa (score/resumo) à esquerda + módulo do cabeçalho à direita */
    const headerAsideRow = (aside) => `<div class="lc-headrow">${aside}${header()}</div>`;

    const propGrid = `
      <div class="lc-props">
        <div class="prop-box prop-left">
          <div class="prop-col">
            <div class="fld"><div class="k">Adicionada</div><div class="v">04/02/2026</div></div>
            <div class="fld"><div class="k">Envio da proposta</div><div class="v warn">13/02/2026</div></div>
          </div>
          <div class="prop-col">
            <div class="fld"><div class="k">Atualizada</div><div class="v">12/02/2026</div></div>
          </div>
        </div>
        <div class="prop-box prop-right">
          <div class="fld"><div class="k">ID</div><div class="v">1078513</div></div>
          <div class="fld"><div class="k">UASG</div><div class="v">-</div></div>
          <div class="fld"><div class="k">Modalidade</div><div class="v">Pregão - Eletrônico</div></div>
          <div class="fld"><div class="k">Julgamento</div><div class="v">Menor preço por item</div></div>
          <div class="fld"><div class="k">Estado</div><div class="v">PA</div></div>
          <div class="fld"><div class="k">Cidade</div><div class="v">Belém</div></div>
          <div class="fld"><div class="k">Habitantes</div><div class="v">1.303.403</div></div>
          <div class="fld"><div class="k">CAPAG Estadual</div><div class="v"><span class="cap ok">A</span></div></div>
          <div class="fld"><div class="k">CAPAG Municipal</div><div class="v"><span class="cap warn">C</span></div></div>
          <div class="fld"><div class="k">Portal de disputa</div><div class="v">compras.saobernado.sp...</div></div>
        </div>
      </div>`;

    const segCell = `<span class="dt-seg"><span class="seg">Segmento 1</span><span class="seg">Segmento 2</span></span>`;
    const row = (nome, un) => `<tr><td>1</td><td>${nome}</td><td>${segCell}</td><td>${un}</td><td>R$ 00.000,00</td><td>R$ 0.000.000,00</td></tr>`;
    const itemsTable = `
      <div class="datatable">
        <div class="dt-top">
          <div class="dt-title"><h3>Itens com Correspondência</h3><span class="dt-chip">29</span></div>
          <span class="dt-total">Total de itens: 300</span>
        </div>
        <table class="dt">
          <thead><tr>
            <th class="c-lote" scope="col">Lote</th><th class="c-nome" scope="col">Nome</th>
            <th class="c-seg" scope="col">Segmento</th><th class="c-un" scope="col">Unidades</th>
            <th class="c-vu" scope="col">Valor Unitário</th><th class="c-vt" scope="col">Valor Total</th>
          </tr></thead>
          <tbody>
            ${row('Microcomputador desktop básico + Monitor Full HD','94')}
            ${row('Microcomputador desktop intermediário + Monitor Full HD','22')}
            ${row('Microcomputador desktop básico + Monitor Full HD','94')}
            ${row('Notebook básico','186')}
            ${row('Notebook intermediário','5')}
          </tbody>
        </table>
      </div>`;

    /* card completo com o tratamento aplicado */
    const fullCard = ({topEntry='', headerAside='', topModule='', preItems='', topBanner=''}) => `
      <article class="lic-card${topBanner ? ' has-banner' : ''}">
        ${topBanner}
        ${topBar(topEntry)}
        <div class="lc-content">
          ${topModule}
          ${headerAside ? headerAsideRow(headerAside) : header()}
          ${propGrid}
          ${preItems}
          ${itemsTable}
        </div>
      </article>`;

    const proposal = (tag, name, philo, desc, cardHtml) => `<div class="proposal">${cardHtml}</div>`;

    /* ---------- carousel (compartilhado) ---------- */
    const carousel = (slides, labels) => `
      <div class="carousel" data-labels='${JSON.stringify(labels)}'>
        <div class="carousel-nav">
          <button class="car-prev" type="button" aria-label="Variação anterior">‹</button>
          <span class="car-label"></span>
          <button class="car-next" type="button" aria-label="Próxima variação">›</button>
        </div>
        ${slides.map(s => `<div class="carousel-slide">${s}</div>`).join('')}
      </div>`;
    const CAR_LABELS = ['Com itens a revisar','Tudo certo'];
    const ringOffset = (circ, val) => Math.round(circ * (1 - val / 100));

    /* ---------- SCORE (3 temperaturas) ---------- */
    const TEMPS = [
      {cls:'temp-frio',   label:'Frio',   val:39},
      {cls:'temp-morno',  label:'Morno',  val:65},
      {cls:'temp-quente', label:'Quente', val:88},
    ];
    const TEMP_LABELS = TEMPS.map(t => t.label);

    const scoreChip = t => `<button class="score-chip ${t.cls}" type="button" aria-label="Score ${t.val} de 100, ${t.label}">${I.gauge}<b>${t.val}</b><span class="den">/100</span></button>`;
    const scoreMini = t => `
      <div class="score-mini ${t.cls}">
        <div class="sm-head">
          <div class="sm-ring">
            <svg viewBox="0 0 52 52" width="52" height="52"><circle cx="26" cy="26" r="21" fill="none" stroke="var(--muted)" stroke-width="5"/><circle cx="26" cy="26" r="21" fill="none" stroke="var(--tc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="${ringOffset(132, t.val)}" transform="rotate(-90 26 26)"/></svg>
            <span class="sm-val">${t.val}</span>
          </div>
          <div class="sm-info">
            <span class="sm-num">${t.val}<span class="den">/100</span></span>
            <span class="chip">${t.label}</span>
          </div>
        </div>
        <div class="sm-foot">
          <span class="sm-sub">Parcial · 3 campos a revisar</span>
          <a class="sm-link" href="#">Revisar campos</a>
        </div>
      </div>`;
    const scoreBand = t => `
      <div class="score-band ${t.cls}">
        <div class="sb-ring">
          <svg viewBox="0 0 66 66" width="66" height="66"><circle cx="33" cy="33" r="27" fill="none" stroke="var(--muted)" stroke-width="6"/><circle cx="33" cy="33" r="27" fill="none" stroke="var(--tc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="${ringOffset(170, t.val)}" transform="rotate(-90 33 33)"/></svg>
          <span class="num"><b>${t.val}</b><small>/100</small></span>
        </div>
        <div class="sb-mid">
          <div class="sb-temp"><span class="chip">${t.label}</span><span class="muted">Score parcial calculado</span></div>
          <div class="sb-bar"><i style="width:${t.val}%"></i></div>
        </div>
        <div class="sb-rev"><span class="muted">3 campos a revisar</span><button class="btn btn-status" type="button">${I.pencil} Revisar</button></div>
      </div>`;
    const scoreBanner = t => `<div class="score-banner ${t.cls}"><div class="sbn-left">${I.gauge}<b>${t.val}</b><span class="den">/100</span></div><span class="sbn-badge">3 itens para Revisar</span></div>`;

    const scoreCarousel = build => carousel(TEMPS.map(t => fullCard(build(t))), TEMP_LABELS);

    document.getElementById('scoreList').innerHTML =
      proposal('A1','Chip na barra de ações','', '', scoreCarousel(t => ({topEntry: scoreChip(t)}))) +
      proposal('A2','Bloco compacto no cabeçalho','', '', scoreCarousel(t => ({headerAside: scoreMini(t)}))) +
      proposal('A3','Módulo faixa no topo','', '', scoreCarousel(t => ({topModule: scoreBand(t)}))) +
      proposal('A4','Faixa no topo do card','', '', scoreCarousel(t => ({topBanner: scoreBanner(t)})));

    /* ---------- CHECKLIST ----------
       Lista de campos configurada pelo cliente; os valores são extraídos do
       edital (por isso há campos em revisão). Nenhum campo é mais importante
       que outro. O objetivo é dar visibilidade a essa lista/valores no card. */
    const clData = [
      {g:'Variáveis para cálculo do Score', items:[
        ['Encaixa em segmento de interesse?','Sim'],
        ['Exige certidão específica na habilitação?',null],
        ['Exige certificado do fabricante?','Sim'],
        ['Exige Prova de Conceito?','Não'],
        ['Menciona Intelbras?','Não'],
      ]},
      {g:'Condições de Participação', items:[
        ['Permite Consórcio?','Sim'],
        ['Permite Subcontratação?','Não'],
        ['Garantia Contratual?',null],
      ]},
      {g:'Dados Básicos', items:[
        ['Portal de Disputa','compras.saobernado.sp...'],
        ['Legislação','Lei nº 14.133/2021'],
        ['Ata de Registro de Preços?',null],
        ['Código no Portal','90001/2026'],
      ]},
    ];
    /* mesma lista, tudo extraído (sem revisão) */
    const clDataOk = clData.map(s => ({g:s.g, items:s.items.map(i => [i[0], i[1]===null ? 'Não' : i[1]])}));

    const pendingOf = d => d.flatMap(s => s.items).filter(i => i[1] === null).length;
    const secRev = s => s.items.filter(i => i[1] === null).length;
    const clVal = v => v === null ? '<span class="cl-rev">Revisar</span>' : `<span class="v">${v}</span>`;

    /* B1: botão laranja com texto quando há revisão; verde só ícone quando ok */
    const renderEntry = d => {
      const p = pendingOf(d);
      return p
        ? `<button class="checklist-entry" type="button">${I.listChecks}${p} itens para revisar</button>`
        : `<button class="checklist-entry ok" type="button" aria-label="Checklist completo">${I.listChecks}</button>`;
    };

    /* B2: grade com os campos agrupados por seção */
    const renderGrid = d => {
      const p = pendingOf(d);
      return `
      <div class="checklist-mod">
        <div class="clg-head"><b>Checklist</b>${p ? `<span class="chip-rev">${p} a revisar</span>` : ''}</div>
        ${d.map(s => `
          <div class="clg-sec">
            <div class="clg-sec-title">${s.g}</div>
            <div class="clg-grid">
              ${s.items.map(i => `<div class="fld"><div class="k">${i[0]}</div><div class="v">${i[1]===null ? '<span class="cl-rev">Revisar</span>' : i[1]}</div></div>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;
    };

    /* B3: acordeão por seção */
    const accChev = '<svg class="ca-chev" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
    const renderAcc = d => {
      const p = pendingOf(d);
      return `
      <div class="checklist-acc">
        <div class="ca-head"><b>Checklist</b>${p ? `<span class="chip-rev">${p} a revisar</span>` : ''}</div>
        ${d.map((s, idx) => `
          <details class="ca-sec"${idx===0 ? ' open' : ''}>
            <summary class="ca-sum">${s.g}<span class="ca-count">${s.items.length} campos</span>${secRev(s) ? `<span class="chip-rev">${secRev(s)} a revisar</span>` : ''}${accChev}</summary>
            <div class="ca-body">
              ${s.items.map(i => `<div class="ca-row"><span class="k">${i[0]}</span>${clVal(i[1])}</div>`).join('')}
            </div>
          </details>`).join('')}
      </div>`;
    };

    /* B4: botão "Checklist" na barra (verde=ok / laranja=revisar); dropdown com as seções (nome) e seus campos+valores */
    const cddChev = '<svg class="cdd-chev" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
    const renderDropdown = d => {
      const p = pendingOf(d);
      return `
      <details class="checklist-dd${p ? '' : ' ok'}">
        <summary class="cdd-trigger">${I.listChecks}Checklist${cddChev}</summary>
        <div class="cdd-panel">
          ${d.map(s => `
            <div class="cdd-group">
              <div class="cdd-group-head"><span class="cdd-title">${s.g}</span>${secRev(s) ? `<span class="chip-rev">${secRev(s)} a revisar</span>` : ''}</div>
              ${s.items.map(i => `<div class="cdd-field"><span class="cdd-f-name">${i[0]}</span>${i[1]===null ? '<span class="cl-rev">Revisar</span>' : `<span class="cdd-f-val">${i[1]}</span>`}</div>`).join('')}
            </div>`).join('')}
          <button class="btn btn-primary cdd-full" type="button">Ver lista completa</button>
        </div>
      </details>`;
    };

    const clCarousel = build => carousel([ fullCard(build(clData)), fullCard(build(clDataOk)) ], CAR_LABELS);

    document.getElementById('checklistList').innerHTML =
      proposal('B1','Botão de acesso','', '', clCarousel(d => ({topEntry: renderEntry(d)}))) +
      proposal('B2','Grade dos campos por seção','', '', clCarousel(d => ({preItems: renderGrid(d)}))) +
      proposal('B3','Acordeão por seção','', '', clCarousel(d => ({preItems: renderAcc(d)}))) +
      proposal('B4','Botão Checklist com dropdown','', '', clCarousel(d => ({topEntry: renderDropdown(d)})));

    /* ---------- carousel ---------- */
    document.querySelectorAll('.carousel').forEach(car => {
      const slides = [...car.querySelectorAll('.carousel-slide')];
      const label = car.querySelector('.car-label');
      const labels = JSON.parse(car.dataset.labels || '[]');
      let idx = 0;
      const show = () => { slides.forEach((s, i) => { s.hidden = i !== idx; }); if (label) label.textContent = labels[idx] || ((idx + 1) + '/' + slides.length); };
      car.querySelector('.car-prev').addEventListener('click', () => { idx = (idx - 1 + slides.length) % slides.length; show(); });
      car.querySelector('.car-next').addEventListener('click', () => { idx = (idx + 1) % slides.length; show(); });
      show();
    });

    /* ---------- tabs ---------- */
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
      t.classList.add('active'); t.setAttribute('aria-selected','true');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    }));
  </script>
</body>
</html>
