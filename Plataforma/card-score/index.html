<!doctype html>
<!--
  ============================================================================
  SETTLE — Propostas de evidência do Score / Checklist no card
  Comparação com 2 tabs (Score, Checklist), 3 modelos de card cada.
  Score e Checklist são produtos separados (vendidos por cliente): nunca
  coexistem. Cada modelo usa o card COMPLETO (metadados + itens) com o
  tratamento aplicado por cima.
  ============================================================================
-->
<html lang="pt-BR" data-preview="CARD-SCORE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settle — Propostas: Score e Checklist no card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../assets/settle.css" />

  <style>
    body{background:var(--muted);}
    .wrap{max-width:1460px;margin:0 auto;padding:28px 32px 90px;}

    /* tabs (usa .tabs/.tab do settle.css) */
    .tabbar{margin:0 0 22px;}
    .panel{display:none;}
    .panel.active{display:block;}
    /* espaçamento entre os cards */
    .proposal{margin-bottom:24px;}

    /* ===================== TEMPERATURA ===================== */
    .temp-frio{--tc:var(--destructive);--tbg:rgba(220,38,38,.1);}
    .temp-morno{--tc:var(--warning);--tbg:rgba(217,119,6,.1);}
    .temp-quente{--tc:var(--success);--tbg:rgba(22,163,74,.1);}
    .chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:16px;padding:2px 7px;border-radius:6px;background:var(--tbg);color:var(--tc);}

    /* ---- A1: chip de score na barra de ações ---- */
    .score-chip{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;height:32px;padding:0 12px;background:var(--tbg);color:var(--tc);font-size:14px;font-weight:600;white-space:nowrap;}
    .score-chip svg{width:16px;height:16px;}
    .score-chip .den{font-weight:500;opacity:.75;}
    .score-chip .sep-dot{opacity:.5;}

    /* ---- A2 / B2: caixa ao lado do cabeçalho (compacta, no canto direito) ---- */
    .lc-headrow{display:flex;gap:8px;align-items:flex-start;}
    .lc-headrow > .module{flex:1;min-width:0;}
    .score-mini{flex:none;width:261px;border:1px solid var(--border);border-radius:var(--radius-box);padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:14px;}
    .sm-head{display:flex;align-items:center;gap:14px;}
    .sm-ring{flex:none;position:relative;width:52px;height:52px;}
    .sm-ring .sm-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--tc);}
    .sm-info{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
    .sm-num{font-size:22px;font-weight:700;line-height:1;}
    .sm-num .den{font-size:13px;font-weight:500;color:var(--muted-foreground);}
    .sm-foot{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--border);}
    .sm-sub{font-size:13px;color:var(--muted-foreground);line-height:18px;}
    .sm-link{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;}

    /* ---- A3: módulo faixa de score no topo ---- */
    .score-band{display:flex;align-items:center;gap:20px;border:1px solid var(--border);border-radius:var(--radius-box);padding:12px 16px;background:var(--card);}
    .sb-ring{flex:none;position:relative;width:66px;height:66px;}
    .sb-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--tc);}
    .sb-ring .num b{font-size:20px;font-weight:700;}
    .sb-ring .num small{font-size:9px;font-weight:600;opacity:.7;margin-top:1px;}
    .sb-mid{flex:1;min-width:120px;}
    .sb-temp{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .sb-temp .muted{font-size:13px;color:var(--muted-foreground);}
    .sb-bar{height:8px;border-radius:9999px;background:var(--muted);overflow:hidden;}
    .sb-bar i{display:block;height:100%;border-radius:9999px;background:var(--tc);}
    .sb-rev{flex:none;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
    .sb-rev .muted{font-size:13px;color:var(--warning);font-weight:500;}

    /* ---- B1: botão de checklist na barra ---- */
    .checklist-entry{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-100);color:var(--accent-600);font-size:14px;font-weight:600;white-space:nowrap;}
    .checklist-entry svg{width:16px;height:16px;}
    .chip-rev{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:16px;padding:2px 7px;border-radius:6px;background:var(--warning-bg);color:var(--warning);}

    /* ---- B2: bloco compacto de resumo ---- */
    .resumo-mini{flex:none;width:340px;border:1px solid var(--border);border-radius:var(--radius-box);padding:12px 14px;background:var(--card);}
    .rm-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .rm-head svg{width:16px;height:16px;color:var(--muted-foreground);}
    .rm-head b{font-size:14px;font-weight:600;}
    .rm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
    .rm-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted-foreground);}
    .rm-list li b{color:var(--foreground);font-weight:600;}
    .rm-list li .rev{font-style:normal;color:var(--warning);font-weight:600;}
    .rm-more{display:inline-block;margin-top:10px;font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;}

    /* ---- B3: checklist embutido como seção ---- */
    .checklist-section{border:1px solid var(--border);border-radius:var(--radius-box);overflow:hidden;background:var(--card);}
    .cs-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
    .cs-head b{font-size:15px;font-weight:600;}
    .cs-copy{margin-left:auto;font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;}
    .cs-group-title{font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.03em;padding:10px 12px 4px;}
    .cs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid var(--border);font-size:14px;}
    .cs-group-title + .cs-row{border-top:none;}
    .cs-row .k{color:var(--foreground);}
    .cs-row .v{color:var(--muted-foreground);}
    .cs-row .btn-rev{border:1px solid var(--accent);background:var(--card);color:var(--accent-600);font-size:12px;font-weight:600;padding:3px 10px;border-radius:7px;}
    .cs-pts{display:inline-flex;align-items:center;gap:6px;}
    .cs-pts .pts{font-size:12px;font-weight:600;color:var(--muted-foreground);}
    .cs-pts .ok{font-size:12px;font-weight:600;color:var(--success);background:rgba(22,163,74,.1);padding:2px 7px;border-radius:6px;}

    /* ---- A4 / B4: faixa acima do card ---- */
    .card-with-banner{display:flex;flex-direction:column;gap:8px;}
    .score-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;padding:12px 18px;background:var(--tbg);}
    .score-banner.neutral{background:var(--muted);}
    .sbn-left{display:flex;align-items:center;gap:8px;color:var(--tc);font-size:18px;font-weight:700;line-height:1;}
    .score-banner.neutral .sbn-left{color:var(--foreground);}
    .sbn-left svg{width:20px;height:20px;}
    .sbn-left .den{font-weight:500;opacity:.7;font-size:15px;}
    .sbn-label{font-size:15px;font-weight:600;}
    .sbn-badge{background:var(--warning);color:var(--primary-foreground);font-size:13px;font-weight:600;padding:5px 12px;border-radius:8px;white-space:nowrap;}

    @media (max-width:900px){
      .mh-row{flex-direction:column;} .score-mini,.resumo-mini{width:100%;}
      .score-band{flex-wrap:wrap;} .sb-rev{text-align:left;align-items:flex-start;}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="tabbar">
      <div class="tabs" role="tablist">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="score">Score</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="checklist">Checklist</button>
      </div>
    </div>

    <section class="panel active" id="panel-score" role="tabpanel">
      <div id="scoreList"></div>
    </section>

    <section class="panel" id="panel-checklist" role="tabpanel">
      <div id="checklistList"></div>
    </section>
  </div>

  <script>
    const I = {
      gauge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>',
      doc:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 1.8h4L12 5.3v8.4a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V2.3a.5.5 0 0 1 .5-.5z"/><path d="M8.3 1.8V5.3H12M6 8h4M6 10.4h4"/></svg>',
      refresh:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5.25A4.5 4.5 0 0 0 2.7 3.15L1.5 4.35M1.5 6.75a4.5 4.5 0 0 0 7.8 2.1l1.2-1.2"/><path d="M1.5 1.5v2.85h2.85M10.5 10.5V7.65H7.65"/></svg>',
      pencil:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3 2.7a1.4 1.4 0 0 1 2 2L5.5 12.5l-2.7.6.6-2.7z"/></svg>',
      person:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0z"/></svg>',
      bell:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5.2a3.2 3.2 0 0 0-6.4 0c0 3-1.3 4-1.3 4h9.6s-1.1-.8-1.3-3M6.8 12.5a1.4 1.4 0 0 0 2.4 0"/><circle cx="12" cy="3.6" r="1.7" fill="currentColor" stroke="none"/></svg>',
      bookmark:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h8a.5.5 0 0 1 .5.5v10.5l-4.5-2.6L3.5 13.5V3a.5.5 0 0 1 .5-.5z"/></svg>',
      link:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a2.4 2.4 0 0 0 3.4 0l2-2a2.4 2.4 0 0 0-3.4-3.4l-.9.9"/><path d="M9.5 6.5a2.4 2.4 0 0 0-3.4 0l-2 2a2.4 2.4 0 0 0 3.4 3.4l.9-.9"/></svg>',
      share:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.8"/><circle cx="4" cy="8" r="1.8"/><circle cx="12" cy="12" r="1.8"/><path d="M5.6 7.1 10.4 4.9M5.6 8.9l4.8 2.2"/></svg>',
      folder:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1 1 0 0 1 3 3.5h3l1.3 1.5H13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>'
    };

    const softIcons = `
      <button class="soft-ia" type="button" aria-label="Notificações">${I.bell}</button>
      <button class="soft-ia" type="button" aria-label="Salvar">${I.bookmark}</button>
      <button class="soft-ia accent" type="button" aria-label="Copiar link">${I.link}</button>
      <button class="soft-ia" type="button" aria-label="Compartilhar">${I.share}</button>
      <button class="soft-ia" type="button" aria-label="Arquivos">${I.folder}</button>`;

    const avatars = `
      <span class="lc-avatars" aria-label="Responsáveis">
        <span class="lc-av ph" aria-hidden="true">${I.person}</span>
        <span class="lc-av ph" aria-hidden="true">${I.person}</span>
        <span class="lc-av ph" aria-hidden="true">${I.person}</span>
        <button class="lc-av add" type="button" aria-label="Adicionar responsável">+</button>
      </span>`;

    const topBar = (entry='') => `
      <div class="lc-top">
        <div class="lc-top-left">
          <button class="lc-chk" type="button" aria-label="Selecionar edital"></button>
          <span class="lc-title"><b>Edital</b> <span class="num">90001/2026</span></span>
          <span class="badge-updated">${I.refresh} Atualizado</span>
        </div>
        <div class="lc-top-actions">
          <button class="btn btn-secondary" type="button">Descartar</button>
          <button class="btn btn-primary" type="button">Enviar para análise</button>
          <span class="vsep" aria-hidden="true"></span>
          <button class="btn btn-status" type="button">${I.pencil} Em disputa ou Homologação</button>
          <span class="vsep" aria-hidden="true"></span>
          ${avatars}
          <span class="vsep" aria-hidden="true"></span>
          ${softIcons}
          ${entry ? `<span class="vsep" aria-hidden="true"></span>${entry}` : ''}
        </div>
      </div>`;

    const headerInner = `
      <div class="lc-segments"><span class="seg">Segmento 1</span><span class="seg">Segmento 2</span></div>
      <div class="lc-org"><span><b>Órgão:</b> EPA - PROCURADORIA GERAL DO ESTADO DO PARÁ</span><span class="tag-light">ME - EPP</span></div>
      <p class="lc-obj"><b>Objeto:</b> Licitação para fornecimento de computadores desktop, notebooks, monitores e periféricos para atender a rede municipal de ensino. Inclui instalação, configuração e garantia de 36 meses com suporte on-site. Entrega em 47 unidades escolares.</p>
      <p class="lc-valor">Valor global: R$ 47.284.499,63</p>`;

    const header = () => `<div class="module">${headerInner}</div>`;
    /* caixa (score/resumo) à esquerda + módulo do cabeçalho à direita */
    const headerAsideRow = (aside) => `<div class="lc-headrow">${aside}${header()}</div>`;

    const propGrid = `
      <div class="lc-props">
        <div class="prop-box prop-left">
          <div class="prop-col">
            <div class="fld"><div class="k">Adicionada</div><div class="v">04/02/2026</div></div>
            <div class="fld"><div class="k">Envio da proposta</div><div class="v warn">13/02/2026</div></div>
          </div>
          <div class="prop-col">
            <div class="fld"><div class="k">Atualizada</div><div class="v">12/02/2026</div></div>
          </div>
        </div>
        <div class="prop-box prop-right">
          <div class="fld"><div class="k">ID</div><div class="v">1078513</div></div>
          <div class="fld"><div class="k">UASG</div><div class="v">-</div></div>
          <div class="fld"><div class="k">Modalidade</div><div class="v">Pregão - Eletrônico</div></div>
          <div class="fld"><div class="k">Julgamento</div><div class="v">Menor preço por item</div></div>
          <div class="fld"><div class="k">Estado</div><div class="v">PA</div></div>
          <div class="fld"><div class="k">Cidade</div><div class="v">Belém</div></div>
          <div class="fld"><div class="k">Habitantes</div><div class="v">1.303.403</div></div>
          <div class="fld"><div class="k">CAPAG Estadual</div><div class="v"><span class="cap ok">A</span></div></div>
          <div class="fld"><div class="k">CAPAG Municipal</div><div class="v"><span class="cap warn">C</span></div></div>
          <div class="fld"><div class="k">Portal de disputa</div><div class="v">compras.saobernado.sp...</div></div>
        </div>
      </div>`;

    const segCell = `<span class="dt-seg"><span class="seg">Segmento 1</span><span class="seg">Segmento 2</span></span>`;
    const row = (nome, un) => `<tr><td>1</td><td>${nome}</td><td>${segCell}</td><td>${un}</td><td>R$ 00.000,00</td><td>R$ 0.000.000,00</td></tr>`;
    const itemsTable = `
      <div class="datatable">
        <div class="dt-top">
          <div class="dt-title"><h3>Itens com Correspondência</h3><span class="dt-chip">29</span></div>
          <span class="dt-total">Total de itens: 300</span>
        </div>
        <table class="dt">
          <thead><tr>
            <th class="c-lote" scope="col">Lote</th><th class="c-nome" scope="col">Nome</th>
            <th class="c-seg" scope="col">Segmento</th><th class="c-un" scope="col">Unidades</th>
            <th class="c-vu" scope="col">Valor Unitário</th><th class="c-vt" scope="col">Valor Total</th>
          </tr></thead>
          <tbody>
            ${row('Microcomputador desktop básico + Monitor Full HD','94')}
            ${row('Microcomputador desktop intermediário + Monitor Full HD','22')}
            ${row('Microcomputador desktop básico + Monitor Full HD','94')}
            ${row('Notebook básico','186')}
            ${row('Notebook intermediário','5')}
          </tbody>
        </table>
      </div>`;

    /* card completo com o tratamento aplicado */
    const fullCard = ({topEntry='', headerAside='', topModule='', preItems=''}) => `
      <article class="lic-card">
        ${topBar(topEntry)}
        <div class="lc-content">
          ${topModule}
          ${headerAside ? headerAsideRow(headerAside) : header()}
          ${propGrid}
          ${preItems}
          ${itemsTable}
        </div>
      </article>`;

    const proposal = (tag, name, philo, desc, cardHtml) => `<div class="proposal">${cardHtml}</div>`;

    /* ---------- SCORE (39/100, Frio) ---------- */
    const scoreChip = `<button class="score-chip temp-frio" type="button" aria-label="Score 39 de 100, Frio">${I.gauge}<b>39</b><span class="den">/100</span></button>`;
    const scoreMini = `
      <div class="score-mini temp-frio">
        <div class="sm-head">
          <div class="sm-ring">
            <svg viewBox="0 0 52 52" width="52" height="52"><circle cx="26" cy="26" r="21" fill="none" stroke="var(--muted)" stroke-width="5"/><circle cx="26" cy="26" r="21" fill="none" stroke="var(--tc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="81" transform="rotate(-90 26 26)"/></svg>
            <span class="sm-val">39</span>
          </div>
          <div class="sm-info">
            <span class="sm-num">39<span class="den">/100</span></span>
            <span class="chip">Frio</span>
          </div>
        </div>
        <div class="sm-foot">
          <span class="sm-sub">Parcial · 3 campos a revisar</span>
          <a class="sm-link" href="#">Revisar campos</a>
        </div>
      </div>`;
    const scoreBand = `
      <div class="score-band temp-frio">
        <div class="sb-ring">
          <svg viewBox="0 0 66 66" width="66" height="66"><circle cx="33" cy="33" r="27" fill="none" stroke="var(--muted)" stroke-width="6"/><circle cx="33" cy="33" r="27" fill="none" stroke="var(--tc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="104" transform="rotate(-90 33 33)"/></svg>
          <span class="num"><b>39</b><small>/100</small></span>
        </div>
        <div class="sb-mid">
          <div class="sb-temp"><span class="chip">Frio</span><span class="muted">Score parcial calculado</span></div>
          <div class="sb-bar"><i style="width:39%"></i></div>
        </div>
        <div class="sb-rev"><span class="muted">3 campos a revisar</span><button class="btn btn-status" type="button">${I.pencil} Revisar</button></div>
      </div>`;

    document.getElementById('scoreList').innerHTML =
      proposal('A1','Chip na barra de ações','destacar entrada',
        'O acesso ao sheet vira um chip forte com número e temperatura, no lugar do iconezinho. Não traz conteúdo para o card.',
        fullCard({topEntry: scoreChip})) +
      proposal('A2','Bloco compacto no cabeçalho','preview',
        'Um bloco ao lado do cabeçalho com anel, número, temperatura e os campos a revisar. Preview sem ocupar o card todo.',
        fullCard({headerAside: scoreMini})) +
      proposal('A3','Módulo faixa no topo','preview',
        'Uma faixa no topo do conteúdo com número grande, barra de progresso do score parcial e ação de revisar. Máxima evidência.',
        fullCard({topModule: scoreBand})) +
      proposal('A4','Faixa acima do card','destacar + revisão',
        'O score vira uma faixa de largura cheia acima do card, tingida pela temperatura, com o total e os itens a revisar.',
        `<div class="card-with-banner"><div class="score-banner temp-frio"><div class="sbn-left">${I.gauge}<b>39</b><span class="den">/100</span></div><span class="sbn-badge">3 itens para Revisar</span></div>${fullCard({})}</div>`);

    /* ---------- CHECKLIST ---------- */
    const checklistEntry = `<button class="checklist-entry" type="button">${I.doc}Checklist<span class="chip-rev">3</span></button>`;
    const resumoMini = `
      <div class="resumo-mini">
        <div class="rm-head">${I.doc}<b>Checklist</b><span class="chip-rev">3 a revisar</span></div>
        <ul class="rm-list">
          <li><span>Encaixa em segmento de interesse?</span><em class="rev">Revisar</em></li>
          <li><span>Exige certidão específica na habilitação?</span><em class="rev">Revisar</em></li>
          <li><span>Menciona Intelbras?</span><b>Não</b></li>
        </ul>
        <a class="rm-more" href="#">Ver resumo completo</a>
      </div>`;
    const checklistSection = `
      <div class="checklist-section">
        <div class="cs-head">${I.doc}<b>Checklist</b><span class="chip-rev">3 a revisar</span><a class="cs-copy" href="#">Copiar conteúdo</a></div>
        <div class="cs-group-title">Variáveis para cálculo do Score</div>
        <div class="cs-row"><span class="k">Encaixa em segmento de interesse?</span><button class="btn-rev" type="button">Revisar</button></div>
        <div class="cs-row"><span class="k">Exige certidão específica na habilitação?</span><button class="btn-rev" type="button">Revisar</button></div>
        <div class="cs-row"><span class="k">Menciona Intelbras?</span><span class="cs-pts"><span class="pts">Não</span><span class="ok">Atende</span></span></div>
        <div class="cs-group-title">Dados Básicos</div>
        <div class="cs-row"><span class="k">Portal de Disputa</span><span class="v">compras.saobernado.sp.gov.br</span></div>
        <div class="cs-row"><span class="k">Legislação</span><span class="v">Lei 14.133/2021</span></div>
      </div>`;

    document.getElementById('checklistList').innerHTML =
      proposal('B1','Botão na barra de ações','destacar entrada',
        'O acesso ao Checklist vira um botão rotulado (não um iconezinho), com contador de itens a revisar. Não traz conteúdo para o card.',
        fullCard({topEntry: checklistEntry})) +
      proposal('B2','Bloco compacto no cabeçalho','preview',
        'Um bloco com uma amostra do resumo (campos-chave) e link para o conteúdo completo. O selo de revisão é condicional.',
        fullCard({headerAside: resumoMini})) +
      proposal('B3','Seção embutida no card','preview',
        'O resumo aparece como uma seção do card, já expandida e clara (sem escurecer). O conteúdo é o foco; a revisão é um selo condicional.',
        fullCard({preItems: checklistSection})) +
      proposal('B4','Faixa acima do card','destacar + revisão',
        'Equivalente à faixa do Score. Como o Checklist não tem temperatura, a faixa é neutra e destaca a revisão pendente (condicional).',
        `<div class="card-with-banner"><div class="score-banner neutral"><div class="sbn-left">${I.doc}<span class="sbn-label">Checklist</span></div><span class="sbn-badge">3 itens para Revisar</span></div>${fullCard({})}</div>`);

    /* ---------- tabs ---------- */
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
      t.classList.add('active'); t.setAttribute('aria-selected','true');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    }));
  </script>
</body>
</html>
