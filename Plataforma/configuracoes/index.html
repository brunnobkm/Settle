    c.querySelector('[data-x]').onclick = fechar; o.onclick = fechar;
    c.querySelector('[data-ok]').onclick = () => { ok(c); fechar(); };

  /* Arrastar para reordenar dentro de um grupo. */
  function arrastavel(root, onMove){
    let de = null;
    root.querySelectorAll('[draggable="true"]').forEach(el => {
      el.addEventListener('dragstart', e => { de = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
      el.addEventListener('dragend', () => { el.classList.remove('dragging'); root.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); });
      el.addEventListener('dragover', e => { if (de && de !== el && de.dataset.g === el.dataset.g) { e.preventDefault(); el.classList.add('over'); } });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); if (de && de !== el) onMove(de.dataset.id, el.dataset.id); });
    });

    else { m.innerHTML = ''; ROTAS[rota](m); }
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', render);
  $('#papel').addEventListener('change', e => { S.papel = e.target.value; render(); });

  function semPermissao(){
    return `<div class="sem-perm"><div class="empty-state">
      <strong>Só administradores alteram esta configuração</strong>
      Você entrou como ${PAPEIS[S.papel]}. Ela vale para toda a organização, por isso fica com quem administra a conta.
      Peça a um administrador: ${ADMINS.slice(0,4).join(', ')} ou ${ADMINS[4]}.
      <div style="margin-top:14px"><a class="btn btn-outline" href="#inicio">Ir para a visão geral</a></div>
    </div></div>`;
  }

  /* ======================= VISÃO GERAL ======================= */
  function inicio(m){
    if (!isAdmin()) {
      m.innerHTML = `<div class="cfg-page"><h1>Configurações</h1>
        <p class="cfg-sub">Você entrou como ${PAPEIS[S.papel]}.</p>
        <div class="empty-state"><strong>As configurações da organização ficam com os administradores</strong>
        Etapas do funil, motivos, campos do card e modelo de e-mail valem para todo mundo da conta.
        Se algo precisar mudar, fale com ${ADMINS.slice(0,3).join(', ')} ou outro administrador.</div></div>`;
      return;
    }
    const vis = S.campos.filter(c=>c.on).length;
    const ativos = t => S.motivos.filter(x=>x.tipo===t && !x.arq).length + (t==='descarte'?1:0);
    const linha = (href, t, d, v) => `<a class="cfg-row" href="${href}"><span class="cfg-txt"><span class="cfg-t">${t}</span><span class="cfg-d">${d}</span></span><span class="cfg-v">${v}</span>${I.chev}</a>`;
    m.innerHTML = `<div class="cfg-page">
      <h1>Configurações</h1>
      <p class="cfg-sub">O que a organização personaliza na Settle, num lugar só. Vale para todas as pessoas da conta e só administradores alteram.</p>

      <section class="cfg-sec"><h2>Licitações</h2>
        <div class="cfg-box">
          ${linha('#etapas','Etapas do funil','Colunas do quadro em Em andamento', S.etapas.length+' etapas')}
          ${linha('#motivos','Motivos de descarte e perda','O que a pessoa escolhe ao descartar ou registrar uma perda', ativos('descarte')+' de descarte · '+ativos('perda')+' de perda')}
          ${linha('#card','Campos do card','Quais informações aparecem no card de Recomendadas e em que ordem', vis+' de '+S.campos.length+' visíveis')}
          ${linha('#email','Modelo de e-mail','Texto de Compartilhar licitação, com variáveis', S.emailPersonalizado?'Personalizado':'Padrão da Settle')}
        </div></section>

      <section class="cfg-sec"><h2>Organização</h2>
        <div class="cfg-box">
          ${linha('#equipe','Equipe','Pessoas, convites e função de cada uma','9 pessoas')}
          ${linha('#permissoes','Permissões','O que cada função pode ver e alterar','4 funções')}
          ${linha('#auditoria','Auditoria','Quem mudou o quê e quando', S.audit.length+' registros')}
        </div></section>

      <section class="cfg-sec"><h2>Atalhos no contexto</h2>
        <p class="cfg-sub">Cada configuração também abre de onde ela é usada. Os atalhos só aparecem para administradores e levam para a mesma página daqui.</p>
        <div class="cfg-box">
          <div class="cfg-row"><span class="cfg-txt cfg-ctx">Em andamento › menu <kbd>⋯</kbd> da coluna › <b>Editar etapas</b></span><a class="cfg-link" href="#etapas">Abrir</a></div>
          <div class="cfg-row"><span class="cfg-txt cfg-ctx">Descartar › lista de motivos › <b>Gerenciar motivos</b></span><a class="cfg-link" href="#motivos">Abrir</a></div>
          <div class="cfg-row"><span class="cfg-txt cfg-ctx">Card de Recomendadas › Ordenar › <b>Personalizar campos do card</b></span><a class="cfg-link" href="#card">Abrir</a></div>
          <div class="cfg-row"><span class="cfg-txt cfg-ctx">Compartilhar licitação › <b>Editar modelo de e-mail</b></span><a class="cfg-link" href="#email">Abrir</a></div>
          <div class="cfg-row"><span class="cfg-txt cfg-ctx">Menu do usuário › <b>Configurações</b> (substitui Gerenciar equipe e Auditoria)</span><a class="cfg-link" href="#inicio">Aqui</a></div>
        </div></section>

      <section class="cfg-sec"><h2>Levantados para as próximas fases</h2>
        <p class="cfg-sub">Outros pontos que já variam por cliente e cabem nesta área. Fora do escopo desta task.</p>
        <div class="cfg-box">
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Substatus</span><span class="cfg-d">Hoje o card tem "Selecionar Substatus" (ex.: Encaminhar e-mail, Esperando aprovação). A lista é do cliente.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Campos do card em Em andamento e colunas da Tabela</span><span class="cfg-d">Mesmo mecanismo de Campos do card, outra tela. Decidir se herdam de Recomendadas.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Segmentos</span><span class="cfg-d">Software, Produtos: rótulo que aparece no card e filtra as recomendadas.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Perfil de recomendação</span><span class="cfg-d">Regiões, faixa de valor, órgãos favoritos e palavras que definem o que chega em Recomendadas.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Notificações</span><span class="cfg-d">O que avisa quem, pela central de notificações e por e-mail.</span></span></div>
        </div></section>
    </div>`;
  }

  /* ======================= ETAPAS ======================= */
  function etapas(m){
    const item = e => {
      const fixa = e.tipo !== 'meio';
      return `<div class="cfg-item" data-id="${e.id}" data-g="${e.tipo}" ${fixa?'':'draggable="true"'}>
        <span class="cfg-grip ${fixa?'fixo':''}" ${fixa?'title="Posição fixa"':''}>${fixa?I.lock:I.grip}</span>
        <span class="cfg-dot" style="background:${e.cor}" aria-hidden="true"></span>
        <input class="cfg-nm" value="${esc(e.nome)}" aria-label="Nome da etapa" data-ren="${e.id}" />
        <span class="cfg-uso">${e.qtd ? fmt(e.qtd)+(e.qtd===1?' licitação':' licitações') : 'vazia'}</span>
        ${fixa ? `<span class="cfg-lock">${I.lock} ${e.tipo==='entrada'?'Agentes começam aqui':'Resultado registrado aqui'}</span>`
               : `<span class="cfg-acts"><button class="cfg-ib perigo" type="button" data-del="${e.id}" aria-label="Remover etapa ${esc(e.nome)}">${I.trash}</button></span>`}
      </div>`;
    };
    const g = t => S.etapas.filter(e=>e.tipo===t).map(item).join('');
    m.innerHTML = `<div class="cfg-page">
      <h1>Etapas do funil</h1>
      <p class="cfg-sub">As colunas do quadro em Em andamento, da análise ao resultado. A mudança vale para todas as pessoas da organização assim que você salva o nome ou solta a etapa no lugar.</p>
      <div class="cfg-aviso">${I.info}<span>A <b>primeira</b> e a <b>última</b> etapas têm posição fixa: os agentes começam a trabalhar quando a licitação entra na primeira e registram o resultado na última. Dá para renomear, mas não mover nem remover.</span></div>
      <div class="cfg-box" id="etBox">
        <div class="cfg-gh">Entrada <span class="cfg-gh-d">· onde a licitação chega depois de Enviar para análise</span></div>
        ${g('entrada')}
        <div class="cfg-gh">Etapas intermediárias <span class="cfg-gh-d">· arraste para reordenar</span></div>
        ${g('meio')}
        <button class="cfg-add" type="button" id="etAdd">${I.plus} Adicionar etapa</button>
        <div class="cfg-gh">Saída</div>
        ${g('saida')}
      </div>

      <section class="cfg-sec" style="margin-top:28px"><h2>O que acontece com o que já existe</h2>
        <div class="cfg-box">
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Renomear</span><span class="cfg-d">As licitações continuam na etapa e o dashboard mantém o histórico: a etapa é acompanhada pelo identificador, não pelo nome.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Reordenar</span><span class="cfg-d">O funil do dashboard passa a seguir a nova ordem. Nenhum número muda.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Remover</span><span class="cfg-d">Se houver licitações na etapa, você escolhe para qual etapa elas vão antes de confirmar. No dashboard, o período em que a etapa existiu continua com o nome dela.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Adicionar</span><span class="cfg-d">A etapa nasce vazia e sem histórico. Aparece no quadro na posição em que você a deixar.</span></span></div>
        </div></section>
    </div>`;

    arrastavel($('#etBox'), (a,b) => { mover(S.etapas,a,b); auditar('Etapas do funil','Reordenou as etapas'); etapas(m); toast('Ordem das etapas salva'); });
    m.querySelectorAll('[data-ren]').forEach(inp => {
      inp.addEventListener('keydown', e => { if (e.key==='Enter') inp.blur(); });
      inp.addEventListener('change', () => {
        const e = S.etapas.find(x=>x.id===inp.dataset.ren); const v = inp.value.trim();
        if (!v) { inp.value = e.nome; return; }
        if (S.etapas.some(x=>x!==e && x.nome.toLowerCase()===v.toLowerCase())) { inp.value = e.nome; toast('Já existe uma etapa com esse nome'); return; }
        auditar('Etapas do funil', `Renomeou "${e.nome}" para "${v}"`); e.nome = v; toast('Nome da etapa salvo');
      });
    });
    m.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => removerEtapa(b.dataset.del, m)));
    $('#etAdd').addEventListener('click', () => {
      const cores = ['#0ea5e9','#84cc16','#f97316','#6366f1','#14b8a6'];
      const n = {id:'e'+Date.now(), nome:'Nova etapa', cor:cores[S.etapas.length%cores.length], qtd:0, tipo:'meio'};
      const iSaida = S.etapas.findIndex(e=>e.tipo==='saida'); S.etapas.splice(iSaida,0,n);
      auditar('Etapas do funil','Adicionou a etapa "Nova etapa"'); etapas(m);
      const inp = m.querySelector(`[data-ren="${n.id}"]`); inp.focus(); inp.select();
    });
  }

  function removerEtapa(id, m){
    const e = S.etapas.find(x=>x.id===id), i = S.etapas.indexOf(e);
    const aplicar = destinoId => {
      const snap = JSON.parse(JSON.stringify(S.etapas));
      const d = S.etapas.find(x=>x.id===destinoId);
      if (d) d.qtd += e.qtd;
      S.etapas = S.etapas.filter(x=>x.id!==id);
      auditar('Etapas do funil', `Removeu "${e.nome}"` + (d && e.qtd ? `, ${e.qtd} licitações movidas para "${d.nome}"` : ''));
      etapas(m);
      toast(d && e.qtd ? `Etapa removida. ${fmt(e.qtd)} licitações foram para ${d.nome}` : 'Etapa removida',
        {undoLabel:'Desfazer', onUndo:()=>{ S.etapas = snap; S.audit.shift(); etapas(m); }});
    };
    if (!e.qtd) { aplicar(null); return; }
    const ops = S.etapas.filter(x=>x.id!==id).map(x =>
      `<option value="${x.id}" ${x===S.etapas[i-1]?'selected':''}>${esc(x.nome)}${x.tipo==='entrada'?' (primeira)':x.tipo==='saida'?' (última)':''}</option>`).join('');
    confirmar({
      titulo:`Remover "${esc(e.nome)}"?`,
      corpo:`<p>${fmt(e.qtd)} ${e.qtd===1?'licitação está':'licitações estão'} nesta etapa. Escolha para onde ${e.qtd===1?'ela vai':'elas vão'}. Responsável, substatus e descrição continuam iguais.</p>
        <label class="cfg-lbl" for="etDest" style="margin-top:12px">Mover licitações para</label>
        <select class="cfg-input" id="etDest">${ops}</select>
        <p style="margin-top:10px;font-size:12.5px">Mudança de etapa por remoção não dispara agentes: voltar para a primeira não roda a análise de novo, e ir para a última não registra resultado (a licitação fica pendente de registro).</p>`,
      acao:'Remover e mover', perigo:true,
      ok: c => aplicar(c.querySelector('#etDest').value)
    });
  }

  /* ======================= MOTIVOS ======================= */
  function motivos(m){
    const t = S.motivoTab;
    const lista = S.motivos.filter(x=>x.tipo===t && !x.arq);
    const arq = S.motivos.filter(x=>x.tipo===t && x.arq);
    const cnt = k => S.motivos.filter(x=>x.tipo===k && !x.arq).length + (k==='descarte'?1:0);
    const escopo = x => (t==='descarte' && !S.unificar) ? `<span class="cfg-escopo" role="group" aria-label="Onde aparece">
        <button type="button" aria-pressed="${x.rec}" data-esc="rec" data-id="${x.id}">Recomendadas</button>
        <button type="button" aria-pressed="${x.and}" data-esc="and" data-id="${x.id}">Em andamento</button></span>` : '';
    const item = x => `<div class="cfg-item" data-id="${x.id}" data-g="m" draggable="true">
        <span class="cfg-grip">${I.grip}</span>
        <input class="cfg-nm" value="${esc(x.nome)}" aria-label="Nome do motivo" data-ren="${x.id}" />
        ${escopo(x)}
        <span class="cfg-uso">${x.uso ? fmt(x.uso)+(t==='descarte'?' descartes':' perdas') : 'nunca usado'}</span>
        <span class="cfg-acts"><button class="cfg-ib perigo" type="button" data-del="${x.id}" aria-label="${x.uso?'Arquivar':'Excluir'} ${esc(x.nome)}" title="${x.uso?'Arquivar':'Excluir'}">${x.uso?I.arq:I.trash}</button></span>
      </div>`;
    m.innerHTML = `<div class="cfg-page">
      <h1>Motivos de descarte e perda</h1>
      <p class="cfg-sub">O que a pessoa escolhe ao descartar uma licitação ou registrar que perdeu. Os motivos alimentam o filtro de Descartadas e o dashboard, por isso um motivo já usado é arquivado, nunca apagado.</p>
      <div class="tabs" role="tablist">
        <button class="tab ${t==='descarte'?'active':''}" type="button" role="tab" aria-selected="${t==='descarte'}" data-tab="descarte">Descarte <span class="cnt">${cnt('descarte')}</span></button>
        <button class="tab ${t==='perda'?'active':''}" type="button" role="tab" aria-selected="${t==='perda'}" data-tab="perda">Perda <span class="cnt">${cnt('perda')}</span></button>
      </div>
      ${t==='descarte' ? `
      <section class="cfg-sec"><div class="cfg-box">
        <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Exigir motivo ao descartar</span><span class="cfg-d">Sem motivo, o botão Descartar fica bloqueado até a pessoa escolher um.</span></span>
          <label class="sw"><input type="checkbox" id="swExigir" ${S.exigirMotivo?'checked':''} aria-label="Exigir motivo ao descartar"><i></i></label></div>
        <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Mesma lista em Recomendadas e Em andamento</span><span class="cfg-d">Desligue para escolher, motivo a motivo, em qual das duas telas ele aparece.</span></span>
          <label class="sw"><input type="checkbox" id="swUnif" ${S.unificar?'checked':''} aria-label="Usar a mesma lista nas duas telas"><i></i></label></div>
      </div></section>` : `<p class="cfg-sub">Aparece quando a licitação chega em ${esc(S.etapas.find(e=>e.tipo==='saida').nome)} e a pessoa registra que perdeu.</p>`}
      <div class="cfg-box" id="mBox">
        ${lista.map(item).join('')}
        ${t==='descarte' ? `<div class="cfg-item"><span class="cfg-grip fixo">${I.lock}</span><span class="cfg-nm">Outros</span><span class="cfg-lock">${I.lock} Sempre disponível · pede descrição</span></div>` : ''}
        <button class="cfg-add" type="button" id="mAdd">${I.plus} Adicionar motivo</button>
      </div>
      ${arq.length ? `<section class="cfg-sec" style="margin-top:24px"><h2>Arquivados</h2>
        <p class="cfg-sub">Não aparecem para novos ${t==='descarte'?'descartes':'registros'}. Continuam nas licitações que já usaram, no filtro de Descartadas e no dashboard.</p>
        <div class="cfg-box">${arq.map(x=>`<div class="cfg-item arquivado"><span class="cfg-nm">${esc(x.nome)}</span><span class="cfg-uso">${fmt(x.uso)} ${t==='descarte'?'descartes':'perdas'}</span><button class="btn btn-outline" type="button" data-rest="${x.id}">Restaurar</button></div>`).join('')}</div></section>` : ''}
    </div>`;

    m.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.motivoTab = b.dataset.tab; motivos(m); });
    const sE = $('#swExigir'); if (sE) sE.onchange = () => { S.exigirMotivo = sE.checked; auditar('Motivos', (sE.checked?'Passou a exigir':'Deixou de exigir')+' motivo ao descartar'); toast('Salvo'); };
    const sU = $('#swUnif'); if (sU) sU.onchange = () => { S.unificar = sU.checked; auditar('Motivos', sU.checked?'Unificou as listas de descarte':'Separou os motivos por tela'); motivos(m); };
    m.querySelectorAll('[data-esc]').forEach(b => b.onclick = () => {
      const x = S.motivos.find(y=>y.id===b.dataset.id), k = b.dataset.esc;
      if (x[k] && !(k==='rec'?x.and:x.rec)) { toast('O motivo precisa aparecer em pelo menos uma tela'); return; }
      x[k] = !x[k]; auditar('Motivos', `Alterou onde "${x.nome}" aparece`); motivos(m);
    });
    m.querySelectorAll('[data-ren]').forEach(inp => {
      inp.addEventListener('keydown', e => { if (e.key==='Enter') inp.blur(); });
      inp.addEventListener('change', () => {
        const x = S.motivos.find(y=>y.id===inp.dataset.ren), v = inp.value.trim();
        if (!v) { inp.value = x.nome; return; }
        auditar('Motivos', `Renomeou "${x.nome}" para "${v}"`); x.nome = v;
        toast(x.uso ? `Nome salvo. As ${fmt(x.uso)} licitações com este motivo passam a mostrar o novo nome` : 'Nome salvo');
      });
    });
    m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const x = S.motivos.find(y=>y.id===b.dataset.del);
      if (!x.uso) {
        const i = S.motivos.indexOf(x); S.motivos.splice(i,1); auditar('Motivos',`Excluiu "${x.nome}"`); motivos(m);
        toast('Motivo excluído', {undoLabel:'Desfazer', onUndo:()=>{ S.motivos.splice(i,0,x); S.audit.shift(); motivos(m); }});
        return;
      }
      confirmar({titulo:`Arquivar "${esc(x.nome)}"?`,
        corpo:`<p>Ele deixa de aparecer para novos ${t==='descarte'?'descartes':'registros de perda'}.</p>
               <p>As ${fmt(x.uso)} licitações que já usaram este motivo continuam com ele, e o filtro de Descartadas e o dashboard seguem contando. Dá para restaurar depois.</p>`,
        acao:'Arquivar', perigo:false,
        ok:()=>{ x.arq = true; auditar('Motivos',`Arquivou "${x.nome}"`); motivos(m); toast('Motivo arquivado'); }});
    });
    m.querySelectorAll('[data-rest]').forEach(b => b.onclick = () => { const x = S.motivos.find(y=>y.id===b.dataset.rest); x.arq = false; auditar('Motivos',`Restaurou "${x.nome}"`); motivos(m); toast('Motivo restaurado'); });
    arrastavel($('#mBox'), (a,b) => { mover(S.motivos,a,b); motivos(m); });
    $('#mAdd').onclick = () => {
      const n = {id:'n'+Date.now(), nome:'Novo motivo', uso:0, rec:true, and:true, tipo:t, arq:false};
      const idx = S.motivos.findIndex(x=>x.tipo===t && !x.arq && x===S.motivos.filter(y=>y.tipo===t && !y.arq).pop());
      S.motivos.splice(idx+1,0,n); auditar('Motivos','Adicionou "Novo motivo"'); motivos(m);
      const inp = m.querySelector(`[data-ren="${n.id}"]`); inp.focus(); inp.select();
    };
  }

  /* ======================= CAMPOS DO CARD ======================= */
  const GRUPOS = [['destaque','Destaque','· abaixo do número do edital'],['datas','Datas','· coluna da esquerda'],['meta','Metadados','· grade de informações'],['itens','Itens','']];

  function card(m){
    const item = c => `<div class="cfg-item" data-id="${c.id}" data-g="${c.g}" ${c.g!=='itens'?'draggable="true"':''}>
        <span class="cfg-grip">${c.g!=='itens'?I.grip:''}</span>
        <label class="sw"><input type="checkbox" data-on="${c.id}" ${c.on?'checked':''} aria-label="Mostrar ${esc(c.nome)}"><i></i></label>
        <span class="cfg-nm" style="${c.on?'':'color:var(--muted-foreground)'}">${esc(c.nome)}</span>
        ${c.var ? `<span class="origem ${c.origem}">${c.origem==='minha'?'Minha variável':'Settle'}</span>
          <span class="cfg-acts"><button class="cfg-ib perigo" type="button" data-rm="${c.id}" aria-label="Tirar ${esc(c.nome)} do card">${I.trash}</button></span>` : ''}
      </div>`;
    m.innerHTML = `<div class="cfg-page larga">
      <h1>Campos do card</h1>
      <p class="cfg-sub">O que aparece no card de Recomendadas e em que ordem. Vale para todas as pessoas da organização. Os campos escondidos continuam disponíveis em Filtrar e Ordenar.</p>
      <div class="cfg-split">
        <div>
          <div class="cfg-box" id="cBox">
            <div class="cfg-gh">Topo <span class="cfg-gh-d">· fixo</span></div>
            <div class="cfg-item"><span class="cfg-grip fixo">${I.lock}</span><span class="cfg-nm">Número do edital, ações e Score</span><span class="cfg-lock">${I.lock} Fixo</span></div>
            ${GRUPOS.map(([g,n,d]) => `<div class="cfg-gh">${n} <span class="cfg-gh-d">${d}</span></div>` + S.campos.filter(c=>c.g===g).map(item).join('')).join('')}
            <button class="cfg-add" type="button" id="cAdd">${I.plus} Adicionar variável como campo</button>
          </div>
          <div class="vf-acts"><button class="btn btn-outline" type="button" id="cReset">Restaurar padrão da Settle</button></div>
        </div>
        <div class="cfg-prev" aria-live="polite">
          <div class="cfg-prev-h">Pré-visualização
            <select class="cfg-input" id="cLic" aria-label="Licitação de exemplo" style="width:auto;margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400">${LICS.map((l,i)=>`<option value="${i}" ${i===S.lic?'selected':''}>Edital ${l.edital}</option>`).join('')}</select></div>
          <div id="cPrev"></div>
        </div>
      </div>
    </div>`;

    m.querySelectorAll('[data-on]').forEach(i => i.onchange = () => {
      const c = S.campos.find(x=>x.id===i.dataset.on); c.on = i.checked;
      auditar('Campos do card', `${c.on?'Mostrou':'Ocultou'} "${c.nome}"`); card(m);
    });
    m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const c = S.campos.find(x=>x.id===b.dataset.rm); S.campos = S.campos.filter(x=>x!==c); auditar('Campos do card',`Tirou a variável "${c.nome}" do card`); card(m); });
    arrastavel($('#cBox'), (a,b) => { mover(S.campos,a,b); auditar('Campos do card','Reordenou os campos'); card(m); });
    $('#cLic').onchange = e => { S.lic = +e.target.value; prevCard(); };
    $('#cReset').onclick = () => confirmar({titulo:'Restaurar os campos padrão?', corpo:'<p>O card volta a mostrar os campos da Settle na ordem original. Variáveis adicionadas saem do card, mas continuam existindo em Agentes.</p>', acao:'Restaurar', ok:()=>{ S.campos = JSON.parse(JSON.stringify(PADRAO.campos)); auditar('Campos do card','Restaurou o padrão da Settle'); card(m); toast('Campos restaurados'); }});
    $('#cAdd').onclick = e => abrirMenu(e.currentTarget, S.campos.filter(c=>c.var).map(c=>c.id), v => {
      S.campos.push({id:v.k, nome:v.n, g:'meta', on:true, var:true, origem:v.o});
      auditar('Campos do card',`Adicionou a variável "${v.n}" ao card`); card(m); toast(`${v.n} entrou no card, no fim dos metadados`);
    });
    prevCard();
  }

  function prevCard(){
    const L = LICS[S.lic], on = id => { const c = S.campos.find(x=>x.id===id); return c && c.on; };
    const val = c => { if (c.var) { const v = L[c.id]; return v ? esc(v) : '<span class="cfg-dim">Não encontrado</span>'; }
      const map = {capagE:L.capagE, capagM:L.capagM, substatus:'Selecionar Substatus', descricao:'Adicionar Descrição'}; return esc(map[c.id] ?? L[c.id] ?? '-'); };
    const fld = c => `<div class="fld"><div class="k">${esc(c.nome)}</div><div class="v">${val(c)}</div></div>`;
    const dest = S.campos.filter(c=>c.g==='destaque' && c.on).map(c => {
      if (c.id==='segmento') return `<div class="segments" style="margin:10px 0 8px"><span class="tag-light">${L.seg}</span></div>`;
      if (c.id==='me') return L.me ? `<p class="field-line"><span class="tag-light">ME - EPP</span></p>` : '';
      if (c.id==='valor') return `<p class="valor">Valor global: ${L.valor}</p>`;
      return `<p class="field-line"><b>${c.nome}:</b> <span class="obj">${esc(L[c.id])}</span></p>`;
    }).join('');
    const datas = S.campos.filter(c=>c.g==='datas' && c.on), meta = S.campos.filter(c=>c.g==='meta' && c.on);
    $('#cPrev').innerHTML = `<div class="card">
      <div class="card-top"><span class="chk" aria-hidden="true"></span><span class="edital">Edital <b>${L.edital}</b></span>
        <div class="card-top-right"><span class="btn btn-outline">Descartar</span><span class="btn btn-primary">Enviar para análise</span><span class="btn btn-status">${L.score}</span></div></div>
      ${dest}
      ${(datas.length||meta.length) ? `<div class="grid-box" style="margin-top:12px">${datas.length?`<div class="grid-left">${datas.map(fld).join('')}</div>`:''}${meta.length?`<div class="grid-main">${meta.map(fld).join('')}</div>`:''}</div>` : ''}
      ${on('itens') ? `<div class="items-head"><span class="items-title">Itens com Correspondência</span><span class="count-chip">1</span></div>
        <table class="items"><thead><tr><th scope="col">Nome</th><th scope="col">Segmento</th><th scope="col" class="t-right">Valor Total</th></tr></thead>
        <tbody><tr><td>${esc(L.item[0])}</td><td><span class="tag-light">${L.item[1]}</span></td><td class="t-right">${L.item[3]}</td></tr></tbody></table>` : ''}
    </div>`;
  }

  /* ======================= MENU DE VARIÁVEIS ======================= */
  let menuCb = null;
  function abrirMenu(ancora, excluir, cb, pos){
    const menu = $('#varMenu'); menuCb = cb;
    const grupo = (o, t) => { const vs = VARS.filter(v=>v.o===o && !(excluir||[]).includes(v.k)); return vs.length ? `<div class="h">${t}</div>` + vs.map(v=>`<button class="vf-opt" type="button" role="option" data-k="${v.k}"><b>${v.n}</b><span>${v.o==='minha'?'Minha variável · '+v.tipo:'Settle'}</span></button>`).join('') : ''; };
    menu.innerHTML = grupo('settle','Da Settle') + grupo('minha','Da organização (Agentes)') + `<a class="vf-opt criar" href="../../agentes-plataforma/">Criar variável em Agentes</a>`;
    const r = pos || ancora.getBoundingClientRect();
    menu.style.left = Math.min(r.left, innerWidth-340)+'px';
    menu.style.top = Math.min(r.bottom+6, innerHeight-290)+'px';
    menu.hidden = false;
    menu.querySelectorAll('[data-k]').forEach(b => b.onmousedown = e => { e.preventDefault(); const v = VARS.find(x=>x.k===b.dataset.k); fecharMenu(); cb(v); });
    const first = menu.querySelector('[data-k]'); if (first) first.classList.add('on');
  }
  function fecharMenu(){ const mnu = $('#varMenu'); if (mnu) mnu.hidden = true; menuCb = null; }
  document.addEventListener('mousedown', e => { if (!e.target.closest('#varMenu') && !e.target.closest('#cAdd') && !e.target.closest('[data-insert]')) fecharMenu(); });
  document.addEventListener('keydown', e => {
    const menu = $('#varMenu'); if (menu.hidden) return;
    const ops = [...menu.querySelectorAll('[data-k]')]; let i = ops.findIndex(o=>o.classList.contains('on'));
    if (e.key==='ArrowDown'||e.key==='ArrowUp') { e.preventDefault(); ops[i]?.classList.remove('on'); i = (i + (e.key==='ArrowDown'?1:-1) + ops.length) % ops.length; ops[i].classList.add('on'); ops[i].scrollIntoView({block:'nearest'}); }
    if (e.key==='Enter' && i>=0) { e.preventDefault(); const cb = menuCb; const v = VARS.find(x=>x.k===ops[i].dataset.k); fecharMenu(); cb && cb(v); }
  });

  /* ======================= MODELO DE E-MAIL ======================= */
  const chip = k => `<span class="varchip" contenteditable="false" data-var="${k}">${esc(vnome(k))}</span>`;
  const tplHtml = s => esc(s).replace(/\{(\w+)\}/g, (_,k)=>chip(k)).replace(/\n/g,'<br>');
  function htmlTpl(el){
    let out = '';
    el.childNodes.forEach(n => {
      if (n.nodeType===3) out += n.textContent;
      else if (n.dataset && n.dataset.var) out += `{${n.dataset.var}}`;
      else if (n.nodeName==='BR') out += '\n';
      else if (n.nodeName==='DIV' || n.nodeName==='P') out += (out && !out.endsWith('\n') ? '\n' : '') + htmlTpl(n);
      else out += htmlTpl(n);
    });
    return out;
  }

  function email(m){
    m.innerHTML = `<div class="cfg-page larga">
      <h1>Modelo de e-mail</h1>
      <p class="cfg-sub">O texto de Compartilhar licitação. Vale para Gmail e para Copiar texto, em todas as telas onde o card aparece.</p>
      <div class="cfg-split">
        <div>
          <div class="cfg-field"><label class="cfg-lbl" id="lAss">Assunto</label>
            <div class="vf linha" id="vAss" contenteditable="true" role="textbox" aria-labelledby="lAss"></div></div>
          <div class="cfg-field"><label class="cfg-lbl" id="lCor">Corpo</label>
            <div class="vf" id="vCor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="lCor" style="min-height:300px"></div>
            <div class="vf-acts"><span class="vf-hint">Digite <kbd>/</kbd> para inserir uma variável</span>
              <button class="btn btn-outline" type="button" data-insert>Inserir variável</button></div></div>
          <div class="cfg-field"><label class="cfg-lbl" for="eVazio">Quando a variável estiver vazia</label>
            <select class="cfg-input" id="eVazio">
              <option value="texto" ${S.emailVazio==='texto'?'selected':''}>Escrever "não informado"</option>
              <option value="linha" ${S.emailVazio==='linha'?'selected':''}>Tirar a linha inteira do e-mail</option>
            </select></div>
          <div class="vf-acts"><button class="btn btn-primary" type="button" id="eSalvar">Salvar modelo</button>
            <button class="btn btn-outline" type="button" id="eReset">Restaurar padrão da Settle</button></div>
        </div>
        <div class="cfg-prev" aria-live="polite">
          <div class="cfg-prev-h">Pré-visualização
            <select class="cfg-input" id="eLic" aria-label="Licitação de exemplo" style="width:auto;margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400">${LICS.map((l,i)=>`<option value="${i}" ${i===S.lic?'selected':''}>Edital ${l.edital}</option>`).join('')}</select></div>
          <div class="cfg-mail"><div class="cfg-mail-h">Assunto: <b id="pAss"></b></div><div class="cfg-mail-b" id="pCor"></div></div>
          <p class="vf-hint" id="pAviso"></p>
        </div>
      </div>
    </div>`;
    const vA = $('#vAss'), vC = $('#vCor');
    vA.innerHTML = tplHtml(S.emailAssunto); vC.innerHTML = tplHtml(S.emailCorpo);
    let alvo = vC, faixa = null;
    const guardar = el => { alvo = el; const s = getSelection(); if (s.rangeCount && el.contains(s.anchorNode)) faixa = s.getRangeAt(0).cloneRange(); };
    const inserir = v => {
      alvo.focus(); const s = getSelection(); s.removeAllRanges();
      if (faixa) s.addRange(faixa); else { const r = document.createRange(); r.selectNodeContents(alvo); r.collapse(false); s.addRange(r); }
      const r = s.getRangeAt(0); const tmp = document.createElement('span'); tmp.innerHTML = chip(v.k); const node = tmp.firstChild;
      r.deleteContents(); r.insertNode(node); const esp = document.createTextNode(' '); node.after(esp);
      r.setStartAfter(esp); r.collapse(true); s.removeAllRanges(); s.addRange(r); prevEmail();
    };
    [vA, vC].forEach(el => {
      el.addEventListener('keyup', () => guardar(el)); el.addEventListener('mouseup', () => guardar(el));
      el.addEventListener('input', prevEmail);
      el.addEventListener('keydown', e => {
        if (el===vA && e.key==='Enter') { e.preventDefault(); return; }
        if (e.key === '/') {
          e.preventDefault(); guardar(el);
          const s = getSelection(); let rect = s.rangeCount ? s.getRangeAt(0).getBoundingClientRect() : null;
          if (!rect || (!rect.left && !rect.top)) rect = el.getBoundingClientRect();
          abrirMenu(el, [], inserir, {left:rect.left, bottom:rect.bottom});
        }
      });
    });
    m.querySelector('[data-insert]').onclick = e => abrirMenu(e.currentTarget, [], inserir);
    $('#eVazio').onchange = e => { S.emailVazio = e.target.value; prevEmail(); };
    $('#eLic').onchange = e => { S.lic = +e.target.value; prevEmail(); };
    $('#eSalvar').onclick = () => { S.emailAssunto = htmlTpl(vA).replace(/ /g,' '); S.emailCorpo = htmlTpl(vC).replace(/ /g,' '); S.emailPersonalizado = true; auditar('Modelo de e-mail','Alterou o modelo de Compartilhar licitação'); toast('Modelo salvo. Vale a partir do próximo compartilhamento'); };
    $('#eReset').onclick = () => confirmar({titulo:'Restaurar o modelo padrão?', corpo:'<p>Assunto e corpo voltam ao texto da Settle. O que você escreveu se perde.</p>', acao:'Restaurar', perigo:true, ok:()=>{ S.emailAssunto = PADRAO.assunto; S.emailCorpo = PADRAO.corpo; S.emailPersonalizado = false; auditar('Modelo de e-mail','Restaurou o padrão da Settle'); email(m); toast('Modelo restaurado'); }});
    prevEmail();
  }

  function prevEmail(){
    const L = LICS[S.lic]; const vazias = new Set();
    const preencher = (tpl, html) => {
      let linhas = tpl.split('\n');
      if (S.emailVazio === 'linha') linhas = linhas.filter(l => { const ks = [...l.matchAll(/\{(\w+)\}/g)].map(x=>x[1]); const vz = ks.filter(k=>!L[k]); vz.forEach(k=>vazias.add(k)); return !vz.length; });
      return linhas.map(l => esc(l).replace(/\{(\w+)\}/g, (_,k) => {
        if (L[k]) return html ? `<b>${esc(L[k])}</b>` : esc(L[k]);
        vazias.add(k); return html ? '<span class="vazio">não informado</span>' : 'não informado';
      })).join('\n');
    };
    $('#pAss').innerHTML = preencher(htmlTpl($('#vAss')).replace(/ /g,' '), false);
    $('#pCor').innerHTML = preencher(htmlTpl($('#vCor')).replace(/ /g,' '), true);
    $('#pAviso').textContent = vazias.size ? `Vazio nesta licitação: ${[...vazias].map(vnome).join(', ')}.` + (S.emailVazio==='linha' ? ' A linha foi tirada do e-mail.' : '') : 'Todas as variáveis têm valor nesta licitação.';
  }

  /* ======================= ORGANIZAÇÃO ======================= */
  function equipe(m){
    const P = [['Brunno Krier','Administrador','Ativo'],['Larissa Almeida','Administrador','Ativo'],['Alice Iglesias','Administrador','Ativo'],['Bruno Ortiz','Administrador','Ativo'],['Andre Damiano','Administrador','Ativo'],['Malou Chlapec','Administrador','Convite pendente'],['Mateus Brum','Editor completo','Ativo'],['Trochu Kniha','Editor completo','Convite pendente'],['Eloi Pattaro','Editor completo','Desativado']];
    m.innerHTML = `<div class="cfg-page">
      <h1>Equipe</h1>
      <p class="cfg-sub">Hoje em Menu do usuário › Gerenciar equipe. Passa a morar aqui, com a mesma tabela e as mesmas ações (convidar, mudar função, resetar senha, remover).</p>
      <div class="cfg-box"><table class="dt"><thead><tr><th scope="col">Pessoa</th><th scope="col">Função</th><th scope="col">Status</th></tr></thead>
      <tbody>${P.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td></tr>`).join('')}</tbody></table></div>
    </div>`;
  }

  function permissoes(m){
    const R = [
      ['Etapas do funil','Altera','Usa','Usa','Vê'],
      ['Motivos de descarte e perda','Altera','Usa','Usa','Não usa (não descarta)'],
      ['Campos do card','Altera','Vê','Vê','Vê'],
      ['Modelo de e-mail','Altera','Usa','Usa','Usa'],
      ['Equipe','Altera','Não vê','Não vê','Não vê'],
      ['Auditoria','Vê','Não vê','Não vê','Não vê'],
      ['Agentes e variáveis','Altera','Usa','Usa','Vê resultados']
    ];
    m.innerHTML = `<div class="cfg-page">
      <h1>Permissões</h1>
      <p class="cfg-sub">As quatro funções que já existem em Gerenciar equipe. Configuração da organização é ação de Administrador; as outras funções usam o que foi configurado.</p>
      <div class="cfg-box"><table class="dt"><thead><tr><th scope="col">Configuração</th><th scope="col">Administrador</th><th scope="col">Editor completo</th><th scope="col">Editor restrito</th><th scope="col">Visualizador</th></tr></thead>
      <tbody>${R.map(r=>`<tr>${r.map((c,i)=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <section class="cfg-sec" style="margin-top:24px"><h2>Regras</h2>
        <div class="cfg-box">
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Negado por padrão</span><span class="cfg-d">Quem não é Administrador não vê a seção nem os atalhos no contexto. Se abrir o link direto, recebe a tela de sem permissão com o nome dos administradores. A regra vale no backend (403), a tela é só a primeira defesa.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Tudo vai para a Auditoria</span><span class="cfg-d">Cada alteração registra quem, quando, a área e o antes/depois.</span></span></div>
          <div class="cfg-row"><span class="cfg-txt"><span class="cfg-t">Teste no protótipo</span><span class="cfg-d">Use "Ver como" no topo para ver a área com outra função.</span></span></div>
        </div></section>
    </div>`;
  }

  function auditoria(m){
    m.innerHTML = `<div class="cfg-page">
      <h1>Auditoria</h1>
      <p class="cfg-sub">Hoje em Menu do usuário › Auditoria. Aqui aparecem só as alterações de configuração; as ações feitas nesta sessão entram no topo.</p>
      <div class="cfg-box"><table class="dt"><thead><tr><th scope="col">Quando</th><th scope="col">Quem</th><th scope="col">Área</th><th scope="col">Alteração</th></tr></thead>
      <tbody>${S.audit.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${esc(a[3])}</td></tr>`).join('')}</tbody></table></div>
    </div>`;
  }

  render();
  })();
  </script>
</body>
</html>
