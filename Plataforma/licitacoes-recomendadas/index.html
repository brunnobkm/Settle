<!doctype html>
<html lang="pt-BR" data-preview="licitacoes-recomendadas">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Licitações — Recomendadas · Selecione quais deseja analisar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --foreground:#0a0a0a;
    --muted-foreground:#737373;
    --border:#e5e5e5;
    --muted:#f5f5f5;
    --background:#ffffff;
    --primary:#171717;
    --primary-foreground:#fafafa;
    --warning:#d97706;
    --warning-bg:#fdf6ec;
    --accent:#3a9b9e;       /* slate-500 (teal) */
    --accent-600:#2a787b;
    --accent-100:#d4eef0;
    --radius-field:8px;
    --radius-box:10px;
    --radius-selector:6px;
    --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05);
    --shadow-card:0 1px 2px 0 rgba(0,0,0,.05), 0 1px 3px 0 rgba(0,0,0,.04);
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--foreground);
    background:var(--background);
    font-size:14px;
    line-height:20px;
  }
  button{font-family:inherit; cursor:pointer;}
  svg{display:block;}

  /* ============ SIDEBAR ============ */
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:52px;
    background:var(--background);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center;
    padding:12px 0; gap:4px; z-index:30;
  }
  .sb-logo{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .sb-nav{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;}
  .sb-btn{
    width:34px;height:34px;border:none;background:transparent;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:#737373;
    transition:background .12s,color .12s;
  }
  .sb-btn:hover{background:var(--muted);color:var(--foreground);}
  .sb-btn.active{background:var(--muted);color:var(--foreground);}
  .sb-divider{width:22px;height:1px;background:var(--border);margin:6px 0;}
  .sb-bottom{margin-top:auto;}
  .sb-avatar{
    width:30px;height:30px;border-radius:50%;background:#1f2937;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  }

  /* ============ SHELL ============ */
  .shell{margin-left:52px;}

  /* ============ NAVBAR ============ */
  .navbar{
    height:64px;display:flex;align-items:center;gap:12px;
    padding:0 24px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--background);z-index:20;
    transition:transform .25s ease;
  }
  /* esconde a navbar ao rolar p/ baixo; reaparece ao rolar p/ cima */
  body.nav-hidden .navbar{transform:translateY(-100%);}
  .navbar .icon-btn{
    width:30px;height:30px;border:none;background:transparent;border-radius:6px;
    display:flex;align-items:center;justify-content:center;color:#737373;
  }
  .navbar .icon-btn:hover{background:var(--muted);color:var(--foreground);}
  .navbar .sep{width:1px;height:22px;background:var(--border);}
  .navbar .hello{font-size:15px;font-weight:600;color:var(--foreground);}

  /* ============ CONTENT ============ */
  .content{max-width:1388px;margin:0 auto;padding:24px 24px 64px;}

  /* header */
  .page-head{margin-bottom:22px;}
  .page-head .eyebrow{font-size:30px;line-height:36px;font-weight:400;color:var(--foreground);margin:0;}
  .page-head .title{font-size:48px;line-height:1.04;font-weight:700;letter-spacing:-.5px;color:var(--foreground);margin:6px 0 0;}

  /* ============ TAB + ACTION BAR ============ */
  /* barra sticky: gruda logo abaixo da navbar (64px) ao rolar — igual ao site */
  .sticky-toolbar{
    position:sticky; top:64px; z-index:15;
    background:#ffffff; padding:14px 0; margin-bottom:8px;
    transition:transform .25s ease;
  }
  /* navbar escondida (rolando p/ baixo): a barra de tabs sobe p/ o topo —
     via transform (mesma timeline da navbar) p/ não abrir vão na transição */
  body.nav-hidden .sticky-toolbar{transform:translateY(-64px);}
  .sticky-toolbar .toolbar{margin-bottom:0;}
  .sticky-toolbar .filter-badges{margin:12px 0 0;}
  /* rolando p/ baixo (navbar escondida): a badge do filtro também some */
  body.nav-hidden .filter-badges{display:none;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .tabs{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(23,23,23,.08);border-radius:10px;padding:3px;
  }
  .tab{
    display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;
    padding:6px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--foreground);opacity:.6;
  }
  .tab:hover{opacity:1;}
  .tab.active{background:#fff;opacity:1;}
  .tab .cnt{
    font-size:12px;line-height:16px;font-weight:500;color:var(--primary);
    background:rgba(23,23,23,.1);padding:1px 6px;border-radius:6px;
  }

  /* grupo segmentado de ações — barra cinza única */
  .actions{display:inline-flex;align-items:center;gap:0;background:rgba(23,23,23,.1);border-radius:8px;overflow:hidden;}
  .act{
    display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;
    padding:6px 12px;border-radius:0;font-size:14px;font-weight:500;color:var(--primary);
  }
  .act:hover{background:rgba(0,0,0,.05);}
  .act .pill-cnt{
    min-width:0;height:18px;padding:0 6px;border-radius:9999px;background:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:400;color:var(--foreground);
  }
  .act .pill-cnt[hidden]{display:none;}

  /* ============ CARD ============ */
  .card-list{display:flex;flex-direction:column;gap:16px;}
  .card{
    background:var(--card,#fff);border:1px solid var(--border);border-radius:var(--radius-box);
    box-shadow:var(--shadow-card);padding:16px 18px;
  }

  .card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .chk{
    width:18px;height:18px;border:1.5px solid #d4d4d4;border-radius:5px;background:#fff;
    flex:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;
    transition:background .12s,border-color .12s;
  }
  .chk.on{background:var(--primary);border-color:var(--primary);}
  .chk svg{opacity:0;}
  .chk.on svg{opacity:1;}

  .edital{font-size:15px;font-weight:600;color:var(--foreground);white-space:nowrap;}
  .edital b{font-weight:700;}

  .badge-updated{
    display:inline-flex;align-items:center;gap:5px;background:var(--warning);color:#fff;
    font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap;
  }

  .card-top-right{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-size:14px;font-weight:500;
    padding:8px 14px;border:1px solid transparent;white-space:nowrap;
  }
  .btn-outline{background:#fff;border-color:var(--border);color:var(--foreground);}
  .btn-outline:hover{background:var(--muted);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-600);border-color:var(--accent-600);}
  .btn-status{background:var(--warning-bg);border-color:#f3e3c8;color:var(--warning);}
  .btn-status:hover{filter:brightness(.98);}

  /* avatar stack */
  .avatars{display:inline-flex;align-items:center;margin-left:2px;}
  .av{
    width:30px;height:30px;border-radius:50%;border:2px solid #fff;margin-left:-8px;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;background:#9ca3af;
  }
  .av:first-child{margin-left:0;}
  .av.add{background:var(--muted);color:var(--muted-foreground);border:2px solid #fff;font-weight:700;}

  .icon-actions{display:inline-flex;align-items:center;gap:6px;margin-left:4px;}
  .ia{
    width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;
    display:inline-flex;align-items:center;justify-content:center;color:#525252;
  }
  .ia:hover{background:var(--muted);color:var(--foreground);}

  /* segments */
  .segments{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap;}
  .seg{background:var(--primary);color:#fafafa;font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;}
  .seg.sm{padding:2px 7px;font-size:11px;}
  .tag-light{background:var(--muted);color:var(--muted-foreground);font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;}

  .field-line{font-size:14px;color:var(--foreground);margin:0 0 8px;line-height:21px;}
  .field-line b{font-weight:600;}
  .field-line .lbl{font-weight:600;}
  .obj{color:var(--foreground);}
  .valor{font-size:15px;font-weight:700;margin:10px 0 14px;}

  /* field grid box */
  .grid-box{display:flex;border:1px solid var(--border);border-radius:var(--radius-field);overflow:hidden;}
  .grid-left{
    flex:none;width:230px;padding:14px 16px;border-right:1px solid var(--border);
    display:flex;flex-direction:column;gap:14px;
  }
  .grid-main{flex:1;padding:14px 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px 18px;}
  .fld{min-width:0;}
  .fld .k{font-size:13px;font-weight:600;color:var(--foreground);margin-bottom:3px;}
  .fld .v{font-size:14px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fld .v.warn{color:var(--warning);font-weight:500;}
  .pair{display:flex;gap:24px;}

  /* items table */
  .items-head{display:flex;align-items:center;gap:10px;margin:20px 0 12px;}
  .items-title{font-size:16px;font-weight:600;}
  .count-chip{
    background:var(--muted);color:var(--muted-foreground);font-size:12px;font-weight:600;
    padding:2px 9px;border-radius:9999px;
  }
  .items-total{margin-left:auto;font-size:13px;color:var(--muted-foreground);}
  table.items{width:100%;border-collapse:collapse;font-size:14px;}
  table.items thead th{
    text-align:left;font-weight:600;color:var(--foreground);font-size:14px;
    padding:10px 12px;border-bottom:1px solid var(--border);
  }
  table.items tbody td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--foreground);}
  table.items tbody tr:hover{background:#fafafa;}
  table.items .col-seg{display:flex;gap:6px;}
  .num{color:var(--muted-foreground);}
  .t-right{text-align:right;}

  /* collapsed cards hide items */
  .card .items-wrap{display:block;}
  .card.collapsed .items-wrap{display:none;}

  .expand-toggle{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;border:none;background:transparent;
    color:var(--muted-foreground);font-size:13px;font-weight:500;padding:4px 0;
  }
  .expand-toggle:hover{color:var(--foreground);}
  .card.collapsed .expand-toggle .chev{transform:rotate(-90deg);}
  .expand-toggle .chev{transition:transform .15s;}

  /* ============ BUSCA (componente — expande no lugar do botão) ============ */
  .actions{transition:width .18s ease;}
  .actions.searching{overflow:visible;}
  .actions .search-field{display:none;align-items:center;gap:8px;padding:0 4px 0 10px;flex:1;min-width:200px;position:relative;flex-wrap:wrap;}
  .actions.searching #searchBtn{display:none;}
  .actions.searching .search-field{display:flex;}
  /* telas estreitas: o campo assume a barra inteira */
  @media (max-width:1040px){
    .actions.searching{flex:1 1 100%;}
    .actions.searching .act{display:none;}
  }

  /* chips de escopo dentro do campo */
  .s-chips{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .s-chips:empty{display:none;}
  .s-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary);color:#fafafa;font-size:12px;font-weight:500;padding:3px 4px 3px 8px;border-radius:6px;white-space:nowrap;}
  .s-chip button{border:none;background:transparent;color:#bdbdbd;cursor:pointer;padding:0;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;}
  .s-chip button:hover{background:rgba(255,255,255,.22);color:#fff;}

  /* botão de filtro de propriedade */
  .s-filter{border:none;background:transparent;color:var(--muted-foreground);cursor:pointer;flex:none;width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;position:relative;}
  .s-filter:hover{background:rgba(0,0,0,.07);color:var(--foreground);}
  .s-filter.active{color:var(--accent);}
  .s-filter .cnt-badge{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;border-radius:9999px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid #fff;}

  /* menu de propriedades */
  .scope-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:60;width:246px;max-height:330px;overflow:auto;
    background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;}
  .scope-menu .sm-head{font-size:11px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 5px;}
  .scope-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--foreground);}
  .scope-item:hover{background:var(--muted);}
  .scope-box{width:16px;height:16px;border:1.5px solid #d4d4d4;border-radius:4px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;}
  .scope-item.on .scope-box{background:var(--accent);border-color:var(--accent);}
  .scope-item .scope-box svg{opacity:0;}
  .scope-item.on .scope-box svg{opacity:1;}
  .scope-sep{height:1px;background:var(--border);margin:4px 2px;}
  .search-field .s-ico{color:var(--muted-foreground);flex:none;}
  .search-field input{
    border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;color:var(--foreground);
    flex:1;min-width:160px;height:30px;
  }
  .search-field input::placeholder{color:var(--muted-foreground);}
  .search-clear{
    border:none;background:transparent;color:var(--muted-foreground);cursor:pointer;flex:none;
    width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  }
  .search-clear:hover{background:rgba(0,0,0,.07);color:var(--foreground);}

  .card.hidden{display:none;}

  /* ===== skeleton de carregamento da busca ===== */
  .skeleton{display:none;flex-direction:column;gap:16px;}
  .card-list.loading > .card,
  .card-list.loading > .empty-state{display:none !important;}
  .card-list.loading > .skeleton{display:flex;}
  .sk-card{border:1px solid var(--border);border-radius:var(--radius-box);background:#fff;
    box-shadow:var(--shadow-card);padding:18px;display:flex;flex-direction:column;gap:14px;}
  .sk-row{display:flex;gap:10px;align-items:center;}
  .sk{display:block;background:#ececec;border-radius:6px;position:relative;overflow:hidden;flex:none;}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
    animation:sk-shimmer 1.15s infinite;}
  @keyframes sk-shimmer{100%{transform:translateX(100%);}}
  @media (prefers-reduced-motion:reduce){ .sk::after{animation:none;} }
  .empty-state{
    text-align:center;padding:56px 16px;color:var(--muted-foreground);font-size:14px;
    border:1px dashed var(--border);border-radius:var(--radius-box);background:#fff;
  }
  .empty-state strong{display:block;color:var(--foreground);font-size:15px;margin-bottom:4px;font-weight:600;}
  .empty-state .q{color:var(--foreground);font-weight:600;}

  /* ============ BADGES DE FILTRO DA TAB ============ */
  .filter-badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 18px;}
  .filter-badges:empty{display:none;}
  /* Soft Badge (Figma 8802:36891): pílula cinza arredondada, texto Geist 12px */
  .fbadge{
    position:relative;display:inline-flex;align-items:center;gap:5px;cursor:pointer;
    background:rgba(23,23,23,.1);border:none;border-radius:9999px;padding:4px 11px;
    font-size:12px;line-height:16px;font-family:inherit;transition:background .12s;
  }
  .fbadge:hover{background:rgba(23,23,23,.16);}
  .fbadge.open{background:rgba(23,23,23,.2);}
  .fbadge .k{color:var(--muted-foreground);}
  .fbadge .v{color:var(--primary);font-weight:600;}
  .fbadge .car{color:var(--muted-foreground);display:inline-flex;margin-left:1px;}

  /* popover base */
  .fb-pop{
    position:absolute;top:calc(100% + 6px);left:0;z-index:70;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.14);padding:8px;
  }
  /* date picker */
  .fb-pop-date{width:300px;}
  .fb-presets{display:flex;gap:4px;background:var(--muted);border-radius:8px;padding:3px;margin-bottom:8px;}
  .fb-presets button{
    flex:1;border:none;background:transparent;border-radius:6px;padding:6px 4px;font-family:inherit;
    font-size:12px;font-weight:500;color:var(--muted-foreground);cursor:pointer;white-space:nowrap;
  }
  .fb-presets button:hover{color:var(--foreground);}
  .fb-presets button.on{background:#fff;color:var(--foreground);box-shadow:var(--shadow-xs);}
  .fb-cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;}
  .fb-cal-title{font-size:14px;font-weight:600;}
  .fb-cal-nav{width:26px;height:26px;border:none;background:transparent;border-radius:6px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground);}
  .fb-cal-nav:hover{background:var(--muted);color:var(--foreground);}
  .fb-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .fb-cal-grid .dow{font-size:11px;color:var(--muted-foreground);text-align:center;padding:4px 0;font-weight:500;}
  .fb-day{height:34px;border:none;background:transparent;border-radius:7px;cursor:pointer;font-family:inherit;
    font-size:13px;color:var(--foreground);display:flex;align-items:center;justify-content:center;}
  .fb-day:hover{background:var(--muted);}
  .fb-day.out{color:#c4c4c4;}
  .fb-day.disabled{color:#d4d4d4;cursor:default;pointer-events:none;}
  .fb-day.today{font-weight:700;box-shadow:inset 0 0 0 1px var(--border);}
  .fb-day.sel{background:var(--accent);color:#fff;font-weight:600;}
  .fb-day.sel:hover{background:var(--accent-600);}

  /* lista multi-seleção */
  .fb-pop-list{width:248px;}
  .fb-list-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 6px;}
  .fb-list-head span{font-size:11px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em;}
  .fb-selall{border:none;background:transparent;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:0;}
  .fb-selall:hover{color:var(--accent-600);}
  .fb-search{position:relative;margin-bottom:4px;}
  .fb-search input{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 30px 7px 10px;
    font-family:inherit;font-size:13px;outline:none;}
  .fb-search input:focus{border-color:#cfcfcf;}
  .fb-search svg{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);}
  .fb-options{max-height:220px;overflow:auto;}
  .fb-opt{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px;}
  .fb-opt:hover{background:var(--muted);}
  .fb-opt .box{width:16px;height:16px;border:1.5px solid #d4d4d4;border-radius:4px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;}
  .fb-opt.on .box{background:var(--accent);border-color:var(--accent);}
  .fb-opt .box svg{opacity:0;}
  .fb-opt.on .box svg{opacity:1;}

  @media (max-width:1100px){
    .grid-main{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" aria-label="Sidebar">
    <div class="sb-logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <circle cx="16" cy="16" r="14" fill="#D6EBDD"/>
        <path d="M22 9 C 14 9 8 14 8 21 C 8 22 9 23 10 23 C 17 23 22 17 22 9 Z" fill="#3D9B5C"/>
        <path d="M22 9 L 11 21" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <nav class="sb-nav">

const SITUACAO = ['Ativas','Em disputa','Homologação','Encerradas','Descartadas'];
const TAB_BADGES = {
  'Todas': [],

  'Chegou hoje':       [{label:'Data de adição', type:'date', mode:'past', value:{date:'19/06/2026'}}],
  'Vencendo em breve': [{label:'Envio da proposta', type:'date', mode:'future', value:{preset:'7d'}}],
};
const DATE_PRESETS = {
  past:   [{key:'todos',label:'Todos'},{key:'24h',label:'Últimas 24h'},{key:'7d',label:'Últimos 7 dias'}],
  future: [{key:'7d',label:'Próximos 7 dias'},{key:'15d',label:'Próximos 15 dias'},{key:'30d',label:'Próximos 30 dias'}],
};
const MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const TODAY = new Date(2026,5,19);                 // referência fixa p/ o protótipo
const fmtD = d => String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
const parseD = s => { const [d,m,y]=s.split('/').map(Number); return new Date(y,m-1,d); };
const TODAY_STR = fmtD(TODAY);

const filterBadges = document.getElementById('filterBadges');
const filtrarCount = document.getElementById('filtrarCount');
let currentTab = 'Todas', fbOpen = null, calView = null;

const SVG_CARET = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function dateLabel(b){
  const v=b.value;
  if(v.preset){ const p=(DATE_PRESETS[b.mode]||[]).find(x=>x.key===v.preset); return p?p.label:v.preset; }
  if(v.date) return v.date===TODAY_STR ? 'Hoje' : v.date;
  return 'Qualquer data';
}
function listLabel(b){
  if(!b.value.length) return 'Qualquer';
  return b.value.length===1 ? b.value[0] : b.value.length+' selecionadas';
}
function renderTabFilters(tab){
  currentTab = tab; closeFbPop();
  const badges = TAB_BADGES[tab] || [];
  if(badges.length){ filtrarCount.hidden=false; filtrarCount.textContent=badges.length; }
  else filtrarCount.hidden=true;
  if(!badges.length){ filterBadges.innerHTML = ''; return; }  // sem filtros: nada aparece
  filterBadges.innerHTML = badges.map((b,i)=>{
    const val = b.type==='date' ? dateLabel(b) : listLabel(b);
    return `<button class="fbadge" data-bi="${i}"><span class="k">${b.label}:</span> <span class="v">${val}</span><span class="car">${SVG_CARET}</span></button>`;
  }).join('');
}
function refreshBadges(){
  const badges = TAB_BADGES[currentTab];
  filterBadges.querySelectorAll('.fbadge').forEach((el,i)=>{
    const b=badges[i]; el.querySelector('.v').textContent = b.type==='date'?dateLabel(b):listLabel(b);
  });
}

/* ---- popover ---- */
function closeFbPop(){
  fbOpen=null;
  document.querySelectorAll('.fb-pop').forEach(p=>p.remove());
  document.querySelectorAll('.fbadge.open').forEach(b=>b.classList.remove('open'));
}
filterBadges.addEventListener('click', e=>{
  const bd = e.target.closest('.fbadge'); if(!bd) return;
  const i = +bd.dataset.bi;
  if(fbOpen===i){ closeFbPop(); return; }
  openFbPop(bd, i);
});
function openFbPop(badgeEl, i){
  closeFbPop(); fbOpen=i; badgeEl.classList.add('open');
  const b = TAB_BADGES[currentTab][i];
  const pop = document.createElement('div');
  pop.className = 'fb-pop ' + (b.type==='date'?'fb-pop-date':'fb-pop-list');
  pop.innerHTML = b.type==='date' ? datePopHTML(b) : listPopHTML(b);
  badgeEl.appendChild(pop);
  const r = pop.getBoundingClientRect();
  if(r.right > window.innerWidth-12){ pop.style.left='auto'; pop.style.right='0'; }
  b.type==='date' ? wireDatePop(pop,b) : wireListPop(pop,b);
}

/* ---- date popover + calendário ---- */
function datePopHTML(b){
  calView = b.value.date ? (d=>({year:d.getFullYear(),month:d.getMonth()}))(parseD(b.value.date))
                         : {year:TODAY.getFullYear(), month:TODAY.getMonth()};
  const presets = (DATE_PRESETS[b.mode]||[]).map(p=>
    `<button data-preset="${p.key}" class="${b.value.preset===p.key?'on':''}">${p.label}</button>`).join('');
  return `<div class="fb-presets">${presets}</div><div class="fb-cal">${calHTML(b)}</div>`;
}
function calHTML(b){
  const {year,month}=calView;
  const startDow = new Date(year,month,1).getDay();
  const days = new Date(year,month+1,0).getDate();
  const prev = new Date(year,month,0).getDate();
  const sel = b.value.date || null;
  let cells='';
  for(let i=startDow-1;i>=0;i--) cells+=`<div class="fb-day out">${prev-i}</div>`;
  for(let d=1; d<=days; d++){
    const date=new Date(year,month,d), ds=fmtD(date), cls=['fb-day'];
    if(ds===TODAY_STR) cls.push('today');
    if(ds===sel) cls.push('sel');
    if(b.mode==='past' && date>TODAY) cls.push('disabled');
    if(b.mode==='future' && date<TODAY) cls.push('disabled');
    cells+=`<button class="${cls.join(' ')}" data-day="${ds}">${d}</button>`;
  }
  const trail = (7 - ((startDow+days)%7))%7;
  for(let d=1; d<=trail; d++) cells+=`<div class="fb-day out">${d}</div>`;
  const nav = dir => `<button class="fb-cal-nav" data-nav="${dir}"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M${dir<0?'10 4 6 8l4 4':'6 4l4 4-4 4'}" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  return `<div class="fb-cal-head">${nav(-1)}<span class="fb-cal-title">${MES[month]} de ${year}</span>${nav(1)}</div>`+
    `<div class="fb-cal-grid">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}
function wireDatePop(pop,b){
  pop.querySelector('.fb-presets').addEventListener('click', e=>{
    const btn=e.target.closest('button[data-preset]'); if(!btn) return;
    b.value={preset:btn.dataset.preset}; refreshBadges(); closeFbPop();
  });
  pop.querySelector('.fb-cal').addEventListener('click', e=>{
    const nav=e.target.closest('[data-nav]');
    if(nav){ calView.month+=+nav.dataset.nav;
      if(calView.month<0){calView.month=11;calView.year--;}
      if(calView.month>11){calView.month=0;calView.year++;}
      pop.querySelector('.fb-cal').innerHTML=calHTML(b); return; }
    const day=e.target.closest('.fb-day[data-day]');
    if(!day || day.classList.contains('disabled')) return;
    b.value={date:day.dataset.day}; refreshBadges(); closeFbPop();
  });
}

/* ---- list popover ---- */
function listPopHTML(b){
  const opts=b.options.map(o=>
    `<label class="fb-opt ${b.value.includes(o)?'on':''}" data-opt="${o}"><span class="box">${I.check}</span>${o}</label>`).join('');
  return `<div class="fb-list-head"><span>Lista de opções</span><button class="fb-selall">${b.value.length===b.options.length?'Limpar':'Selecionar tudo'}</button></div>`+
    `<div class="fb-search"><input type="text" placeholder="Buscar" /><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7.25" cy="7.25" r="4.5"/><path d="M10.75 10.75 14 14"/></svg></div>`+
    `<div class="fb-options">${opts}</div>`;
}
function wireListPop(pop,b){
  const opts=pop.querySelector('.fb-options');
  const selall=pop.querySelector('.fb-selall');
  opts.addEventListener('click', e=>{
    const opt=e.target.closest('.fb-opt'); if(!opt) return;
    e.preventDefault();
    const v=opt.dataset.opt, idx=b.value.indexOf(v);
    idx>=0 ? b.value.splice(idx,1) : b.value.push(v);
    opt.classList.toggle('on');
    selall.textContent = b.value.length===b.options.length ? 'Limpar' : 'Selecionar tudo';
    refreshBadges();
  });
  selall.addEventListener('click', ()=>{
    const all = b.value.length===b.options.length;
    b.value = all ? [] : [...b.options];
    opts.querySelectorAll('.fb-opt').forEach(o=> o.classList.toggle('on', b.value.includes(o.dataset.opt)));
    selall.textContent = all ? 'Selecionar tudo' : 'Limpar';
    refreshBadges();
  });
  const s=pop.querySelector('.fb-search input');
  s.addEventListener('input', ()=>{ const q=norm(s.value);
    opts.querySelectorAll('.fb-opt').forEach(o=> o.style.display = norm(o.dataset.opt).includes(q)?'':'none'); });
  s.focus();
}

// clique fora fecha o popover
document.addEventListener('click', e=>{
  if(fbOpen!==null && !e.target.closest('.fbadge') && !e.target.closest('.fb-pop')) closeFbPop();
});
// Filtrar também só fecha o popover de badge (e abriria o sheet completo no produto real)
renderTabFilters('Todas');

/* ============ BUSCA (componente) ============ */
const actions   = document.getElementById('actions');
const searchBtn = document.getElementById('searchBtn');
const searchFld = document.getElementById('searchField');
const searchInp = document.getElementById('searchInput');
const searchClr = document.getElementById('searchClear');
const searchChips = document.getElementById('searchChips');
const scopeBtn  = document.getElementById('scopeBtn');
const scopeMenu = document.getElementById('scopeMenu');
const emptyState= document.getElementById('emptyState');
const emptyQuery= document.getElementById('emptyQuery');
const eyebrow   = document.getElementById('eyebrow');
const todasCnt  = document.querySelector('.tab.active .cnt');
const cards     = [...document.querySelectorAll('.card')];

const baseEyebrow = eyebrow.textContent;
const baseTodas   = todasCnt.textContent;

// remove acentos p/ casar "belem" com "Belém"
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

// ---- propriedades pesquisáveis (escopos) ----
const SCOPES = [
  {key:'edital',     label:'Edital',            get:d=>d.edital},
  {key:'orgao',      label:'Órgão',             get:d=>d.orgao},
  {key:'objeto',     label:'Objeto',            get:d=>d.objeto},
  {key:'valor',      label:'Valor global',      get:d=>'R$ '+d.valor},
  {key:'id',         label:'ID',                get:d=>d.id},
  {key:'uasg',       label:'UASG',              get:d=>'–'},
  {key:'modalidade', label:'Modalidade',        get:d=>d.modalidade},
  {key:'julgamento', label:'Julgamento',        get:d=>d.julgamento},
  {key:'estado',     label:'Estado',            get:d=>d.estado},
  {key:'cidade',     label:'Cidade',            get:d=>d.cidade},
  {key:'habitantes', label:'Habitantes',        get:d=>d.habitantes},
  {key:'segmento',   label:'Segmento',          get:d=>'Segmento 1 Segmento 2'},
  {key:'adicionada', label:'Adicionada',        get:d=>d.adicionada},
  {key:'atualizada', label:'Atualizada',        get:d=>d.atualizada},
  {key:'envio',      label:'Envio da proposta', get:d=>d.envio},
  {key:'capagE',     label:'CAPAG Estadual',    get:d=>'–'},
  {key:'capagM',     label:'CAPAG Municipal',   get:d=>'–'},
  {key:'portal',     label:'Portal de disputa', get:d=>d.portal},
];
const scopeLabel = k => (SCOPES.find(s=>s.key===k)||{}).label || k;
const activeScopes = new Set();

// indexa o texto de cada propriedade por card (cards[i] ↔ DATA[i])
cards.forEach((card,i)=>{
  card._fields = {};
  SCOPES.forEach(s=> card._fields[s.key] = norm(String(s.get(DATA[i]) ?? '')));
});

// ---- menu de propriedades ----
function buildMenu(){
  scopeMenu.innerHTML =
    '<div class="sm-head">Buscar em</div>' +
    `<div class="scope-item" data-scope="__all__"><span class="scope-box">${I.check}</span>Todos os campos</div>` +
    '<div class="scope-sep"></div>' +
    SCOPES.map(s=>`<div class="scope-item" data-scope="${s.key}"><span class="scope-box">${I.check}</span>${s.label}</div>`).join('');
  syncMenu();
}
function syncMenu(){
  const allOn = activeScopes.size === 0;
  scopeMenu.querySelectorAll('.scope-item').forEach(it=>{
    const k = it.dataset.scope;
    it.classList.toggle('on', k==='__all__' ? allOn : activeScopes.has(k));
  });
}
function chipHTML(k){
  const lbl = scopeLabel(k);
  return `<span class="s-chip" data-scope="${k}">${lbl}<button aria-label="Remover ${lbl}">`+
    `<svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>`;
}
function renderChips(){
  searchChips.innerHTML = [...activeScopes].map(chipHTML).join('');
}
function updateFilterBtn(){
  scopeBtn.classList.toggle('active', activeScopes.size>0);
  let b = scopeBtn.querySelector('.cnt-badge');
  if(activeScopes.size>0){
    if(!b){ b=document.createElement('span'); b.className='cnt-badge'; scopeBtn.appendChild(b); }
    b.textContent = activeScopes.size;
  }else if(b){ b.remove(); }
}

// ---- abrir / fechar / filtrar ----
function openSearch(){ actions.classList.add('searching'); renderChips(); searchInp.focus(); }
function closeSearch(){
  actions.classList.remove('searching');
  scopeMenu.hidden = true;
  searchInp.value = '';
  activeScopes.clear();
  renderChips(); updateFilterBtn(); syncMenu();
  clearTimeout(searchTimer); hideSkeleton(); applyFilter('');
}
let searchTimer = null;
function showSkeleton(){ list.classList.add('loading'); }
function hideSkeleton(){ list.classList.remove('loading'); }
// simula a busca assíncrona: mostra skeleton e revela os resultados após ~450ms
function scheduleSearch(q){
  clearTimeout(searchTimer);
  if(!q.trim()){ hideSkeleton(); applyFilter(''); return; }  // limpou: instantâneo
  showSkeleton();
  searchTimer = setTimeout(()=>{ hideSkeleton(); applyFilter(q); }, 450);
}
function applyFilter(q){
  const query = norm(q.trim());
  const scopeKeys = [...activeScopes];
  let visible = 0;
  cards.forEach(card=>{
    let hit;
    if(!query)               hit = true;
    else if(!scopeKeys.length) hit = norm(card.dataset.search).includes(query);
    else                     hit = scopeKeys.some(k => (card._fields[k]||'').includes(query));
    card.classList.toggle('hidden', !hit);
    if(hit) visible++;
  });
  const noResults = query && visible === 0;
  emptyState.hidden = !noResults;
  emptyQuery.textContent = q.trim();

  if(query){
    const palavra = visible === 1 ? 'licitação' : 'licitações';
    eyebrow.textContent = `Encontramos ${visible} ${palavra} com seus filtros`;
    todasCnt.textContent = visible;
  }else{
    eyebrow.textContent = baseEyebrow;
    todasCnt.textContent = baseTodas;
  }
}

// ---- eventos ----
searchBtn.addEventListener('click', ()=> actions.classList.contains('searching') ? closeSearch() : openSearch());
searchInp.addEventListener('input', e=> scheduleSearch(e.target.value));
searchClr.addEventListener('click', closeSearch);

scopeBtn.addEventListener('click', e=>{ e.stopPropagation(); scopeMenu.hidden = !scopeMenu.hidden; });
scopeMenu.addEventListener('click', e=>{
  const it = e.target.closest('.scope-item'); if(!it) return;
  const k = it.dataset.scope;
  if(k==='__all__') activeScopes.clear();
  else activeScopes.has(k) ? activeScopes.delete(k) : activeScopes.add(k);
  syncMenu(); renderChips(); updateFilterBtn(); scheduleSearch(searchInp.value);
  searchInp.focus();
});
searchChips.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  activeScopes.delete(btn.closest('.s-chip').dataset.scope);
  syncMenu(); renderChips(); updateFilterBtn(); scheduleSearch(searchInp.value);
  searchInp.focus();
});
// clique fora fecha só o menu
document.addEventListener('click', e=>{
  if(!scopeMenu.hidden && !scopeMenu.contains(e.target) && !scopeBtn.contains(e.target)) scopeMenu.hidden = true;
});
searchInp.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(!scopeMenu.hidden) scopeMenu.hidden = true; else closeSearch(); }
});
// atalho "/" abre a busca
document.addEventListener('keydown', e=>{
  if(e.key==='/' && !actions.classList.contains('searching') &&
     !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); openSearch();
  }
});

/* ============ NAVBAR: esconde ao rolar p/ baixo, mostra ao rolar p/ cima ============ */
(function(){
  let lastY = window.scrollY || 0;
  const TH = 80, DELTA = 8;  // TH: zona segura no topo; DELTA: movimento mínimo p/ trocar de estado
  window.addEventListener('scroll', function(){
    const y = window.scrollY;
    if(y < TH){ document.body.classList.remove('nav-hidden'); lastY = y; }       // perto do topo: sempre visível
    else if(y - lastY > DELTA){ document.body.classList.add('nav-hidden'); lastY = y; }    // rolando p/ baixo
    else if(lastY - y > DELTA){ document.body.classList.remove('nav-hidden'); lastY = y; } // rolando p/ cima
    // movimentos pequenos NÃO atualizam lastY → acumulam até o DELTA (evita jitter/momentum)
  }, {passive:true});
})();

buildMenu();
</script>
