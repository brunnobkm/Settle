<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permissões · Settle</title>
<style>
  :root{
    --foreground:#0a0a0a;
    --muted-foreground:#737373;
    --border:#e5e5e5;
    --border-strong:#d4d4d4;
    --muted:#f5f5f5;
    --background:#ffffff;
    --primary:#171717;
    --primary-foreground:#fafafa;
    --accent:#3a9b9e;
    --accent-600:#2a787b;
    --accent-100:#d4eef0;
    /* scope semantics */
    --all-fg:#15803d;     --all-bg:#f0fdf4;   --all-bd:#bbf7d0;
    --resp-fg:#b45309;    --resp-bg:#fffbeb;  --resp-bd:#fde68a;
    --none-fg:#a3a3a3;    --none-bg:#fafafa;  --none-bd:#e5e5e5;
    --deny-fg:#b91c1c;    --deny-bg:#fef2f2;  --deny-bd:#fecaca;
    --radius-field:8px;
    --radius-box:10px;
    --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05);
    --shadow-card:0 1px 2px 0 rgba(0,0,0,.05), 0 1px 3px 0 rgba(0,0,0,.04);
    --shadow-pop:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
    font-family:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}

  /* ---------- Layout shell ---------- */
  .shell{display:flex;min-height:100vh;}
  /* ---------- Sidebar (Settle, colapsada por padrão) ---------- */
  .sidebar{width:60px;flex:none;background:#fafafa;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;position:sticky;top:0;height:100vh;gap:2px;transition:width .18s ease;z-index:40;}
  .sidebar.expanded{width:232px;align-items:stretch;padding:12px 10px;}
  .sb-logo{width:40px;height:40px;flex:none;border:none;background:transparent;display:flex;align-items:center;justify-content:center;margin-bottom:6px;cursor:pointer;border-radius:8px;}
  .sb-logo:hover{background:rgba(0,0,0,.05);}
  .logo-dot{width:26px;height:26px;border-radius:50%;background:#3A9B9E;flex:none;display:inline-block;}
  /* diálogo de confirmação (centrado) */
  .cf-overlay{position:fixed;inset:0;background:rgba(15,15,15,.32);backdrop-filter:blur(1px);display:none;align-items:center;justify-content:center;z-index:140;padding:20px;}
  .cf-overlay.open{display:flex;}
  .confirm{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:430px;padding:24px;}
  .confirm .cf-ic{width:42px;height:42px;border-radius:10px;background:var(--accent-100);color:var(--accent-600);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .confirm h3{margin:0 0 7px;font-size:17px;font-weight:700;}
  .confirm p{margin:0;font-size:13.5px;color:var(--muted-foreground);line-height:1.55;}
  .cf-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .sidebar.expanded .sb-logo{display:none;}
  .sb-ws{display:none;align-items:center;gap:9px;padding:4px 8px 10px;}
  .sidebar.expanded .sb-ws{display:flex;}
  .sb-ws .nm{font-size:14px;font-weight:600;color:#404040;line-height:1.15;}
  .sb-ws .sub{font-size:11px;color:var(--muted-foreground);}
  .sb-ws .chev{margin-left:auto;color:var(--muted-foreground);}
  .sb-nav{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;flex:1;overflow-y:auto;}
  .sidebar.expanded .sb-nav{align-items:stretch;}
  .sb-ic{position:relative;width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;gap:11px;border:none;background:transparent;border-radius:8px;color:#404040;cursor:pointer;transition:background .12s;}
  .sidebar.expanded .sb-ic{width:100%;height:auto;justify-content:flex-start;padding:8px 10px;}
  .sb-ic:hover{background:rgba(0,0,0,.05);}
  .sb-ic.active{background:rgba(0,0,0,.07);color:#0a0a0a;}
  .sb-ic .lbl{display:none;font-size:14px;white-space:nowrap;}
  .sidebar.expanded .sb-ic .lbl{display:inline;}
  .sb-ic .chev{display:none;}
  .sidebar.expanded .sb-ic .chev{display:block;margin-left:auto;color:var(--muted-foreground);}
  .sb-sub{display:none;flex-direction:column;}
  .sidebar.expanded .sb-sub{display:flex;}
  .sb-sub a{padding:7px 10px 7px 40px;font-size:14px;color:#404040;text-decoration:none;border-radius:8px;}
  .sb-sub a:hover{background:rgba(0,0,0,.05);}
  .sb-badge{position:absolute;top:5px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9999px;background:var(--destructive);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .sidebar.expanded .sb-badge{position:static;margin-left:auto;}
  .sb-sec{display:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);padding:14px 10px 4px;}
  .sidebar.expanded .sb-sec{display:block;}
  .sb-sep{width:24px;height:1px;background:var(--border);margin:7px auto;flex:none;}
  .sidebar.expanded .sb-sep{width:auto;margin:7px 10px;}
  .sb-bottom{margin-top:auto;width:100%;display:flex;justify-content:center;padding-top:8px;}
  .sidebar.expanded .sb-bottom{padding:8px 0 0;border-top:1px solid var(--border);margin-top:8px;}
  .sb-avatar{display:flex;align-items:center;gap:9px;border:none;background:transparent;cursor:pointer;border-radius:8px;padding:4px;}
  .sb-avatar:hover{background:rgba(0,0,0,.05);}
  .sidebar.expanded .sb-avatar{width:100%;}
  .av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--muted);color:#404040;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
  .sb-avatar .who{display:none;text-align:left;min-width:0;}
  .sidebar.expanded .sb-avatar .who{display:block;}
  .sb-avatar .who .nm{display:block;font-size:13.5px;font-weight:600;color:#404040;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-avatar .who .em{display:block;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-avatar .who{flex:1;}
  .sb-avatar .chev{display:none;margin-left:auto;color:var(--muted-foreground);}
  .sidebar.expanded .sb-avatar .chev{display:block;}

  /* user popup menu (avatar) */
  .usermenu{position:fixed;display:none;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-pop);width:272px;padding:6px;z-index:120;}
  .usermenu.open{display:block;}
  .um-head{display:flex;align-items:center;gap:11px;padding:10px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .um-head .nm{font-size:14px;font-weight:700;color:var(--foreground);}
  .um-head .em{font-size:12.5px;color:var(--muted-foreground);}
  .usermenu button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:none;background:transparent;border-radius:8px;font-size:14px;color:var(--foreground);text-align:left;cursor:pointer;}
  .usermenu button:hover{background:var(--muted);}
  .usermenu button svg{flex:none;color:var(--muted-foreground);}
  .usermenu .um-sep{height:1px;background:var(--border);margin:6px 4px;}
  .usermenu button.danger,.usermenu button.danger svg{color:var(--destructive);}
  .usermenu button.danger:hover{background:var(--deny-bg);}

  /* ---------- Main / topbar ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);padding:0 20px;height:53px;display:flex;align-items:center;gap:13px;}
  .tb-toggle{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:7px;color:var(--muted-foreground);cursor:pointer;}
  .tb-toggle:hover{background:var(--muted);color:var(--foreground);}
  .tb-div{width:1px;height:20px;background:var(--border);}
  .tb-title{font-size:15px;font-weight:600;color:var(--foreground);}
  .topbar .spacer{flex:1;}
  #tbActions{display:flex;align-items:center;gap:8px;}
  .content{padding:18px 22px 48px;width:100%;}
  /* tabs por função */
  .ftabs{display:inline-flex;gap:2px;flex-wrap:wrap;}
  .ftab{display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted-foreground);cursor:pointer;}
  .ftab:hover{background:var(--muted);}
  .ftab.active{background:var(--muted);color:var(--foreground);}
  .ftab .cnt{font-size:12px;color:var(--muted-foreground);background:rgba(0,0,0,.06);padding:0 6px;border-radius:9999px;line-height:18px;}
  .ftab.active .cnt{background:rgba(0,0,0,.1);}
  /* status/ações da tabela de equipe */
  .row-act{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:7px;color:var(--muted-foreground);cursor:pointer;}
  .row-act:hover{background:var(--muted);}
  .row-act.del:hover{color:var(--destructive);background:var(--deny-bg);}
  td.right .row-act:last-child{margin-right:-6px;}
  .page-title{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0;}
  .page-desc{font-size:14px;color:var(--muted-foreground);margin:6px 0 0;max-width:680px;line-height:1.5;}
  .page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;}
  .page-head .spacer{flex:1;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--radius-field);font-size:14px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--foreground);transition:background .12s,border-color .12s;white-space:nowrap;}
  .btn:hover{background:var(--muted);}
  .btn.primary{background:#3A9B9E;color:#fff;border-color:#3A9B9E;}
  .btn.primary:hover{background:#33888b;}
  .btn.brand{background:#3A9B9E;color:#fff;border-color:#3A9B9E;}
  .btn.brand:hover{background:#33888b;}
  .btn.sm{height:30px;padding:0 10px;font-size:13px;}
  /* pill de função neutra (cinza) estilo Figma */
  .role-pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:9999px;border:1px solid var(--border);background:var(--muted);color:#404040;white-space:nowrap;font-family:inherit;cursor:pointer;transition:background .12s;}
  .role-pill:hover{background:#ececec;}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.ghost:hover{background:var(--muted);}
  .icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:none;background:transparent;color:var(--muted-foreground);}
  .icon-btn:hover{background:var(--muted);color:var(--foreground);}

  /* ---------- Badges ---------- */
  .role-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:9999px;border:1px solid var(--border);background:#fff;white-space:nowrap;}
  .role-badge .dot{width:7px;height:7px;border-radius:50%;}
  button.role-badge{font-family:inherit;cursor:pointer;transition:filter .12s,box-shadow .12s;}
  button.role-badge .chev{opacity:0;margin-left:-2px;transition:opacity .12s;}
  button.role-badge:hover{filter:brightness(.96);box-shadow:0 0 0 3px rgba(0,0,0,.04);}
  button.role-badge:hover .chev{opacity:.55;}
  .role-somente .dot{background:#94a3b8;} .role-somente{border-color:#e2e8f0;background:#f8fafc;color:#475569;}
  .role-seu .dot{background:#0ea5e9;} .role-seu{border-color:#bae6fd;background:#f0f9ff;color:#0369a1;}
  .role-geral .dot{background:#8b5cf6;} .role-geral{border-color:#ddd6fe;background:#f5f3ff;color:#6d28d9;}
  .role-admin .dot{background:#e11d48;} .role-admin{border-color:#fecdd3;background:#fff1f2;color:#be123c;}

  .scope{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;letter-spacing:-.01em;white-space:nowrap;}
  .scope.all{color:var(--all-fg);background:var(--all-bg);border:1px solid var(--all-bd);}
  .scope.resp{color:var(--resp-fg);background:var(--resp-bg);border:1px solid var(--resp-bd);}
  .scope.none{color:var(--none-fg);background:var(--none-bg);border:1px solid var(--none-bd);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:9999px;background:var(--muted);color:var(--muted-foreground);}
  .pill.green{background:var(--all-bg);color:var(--all-fg);}
  .pill.amber{background:var(--resp-bg);color:var(--resp-fg);}
  .pill.deny{background:var(--deny-bg);color:var(--deny-fg);}
  .type-tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace;}
  .type-tag.view{background:#eff6ff;color:#1d4ed8;}
  .type-tag.action{background:#fef3f2;color:#b42318;}

  /* ---------- Tables ---------- */
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-box);box-shadow:var(--shadow-card);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{text-align:left;font-size:12px;font-weight:600;color:var(--muted-foreground);padding:11px 16px;border-bottom:1px solid var(--border);background:#fcfcfc;white-space:nowrap;}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fcfcfc;}
  .u-name{font-weight:500;display:flex;align-items:center;gap:10px;}
  .avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--accent-100);color:var(--accent-600);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
  .u-email{color:var(--muted-foreground);font-size:13px;}
  .muted{color:var(--muted-foreground);}
  .cap{text-transform:capitalize;}
  /* barra de ação em lote */
  .bulkbar{position:fixed;left:calc(50% + 30px);bottom:16px;transform:translateX(-50%) translateY(10px);background:#3A9B9E;color:#fff;border-radius:10px;display:none;align-items:center;height:46px;padding:0 4px 0 16px;box-shadow:0 10px 28px rgba(0,0,0,.20);z-index:95;opacity:0;transition:opacity .18s,transform .18s;}
  .bulkbar.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
  .bb-count{font-size:14px;font-weight:500;white-space:nowrap;padding-right:16px;}
  .bb-div{width:1px;height:22px;background:rgba(255,255,255,.32);flex:none;}
  .bb-actions{display:flex;align-items:center;}
  .bb-actions button{border:none;background:transparent;color:#fff;font-family:inherit;font-size:14px;padding:0 14px;height:46px;cursor:pointer;white-space:nowrap;}
  .bb-actions button:hover{background:rgba(255,255,255,.14);}
  .bb-x{border:none;background:transparent;color:#fff;width:40px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0 8px 8px 0;}
  .bb-x:hover{background:rgba(255,255,255,.14);}
  /* filtros por coluna */
  .th-f{display:inline-flex;align-items:center;gap:5px;}
  .fbtn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:5px;color:#bdbdbd;cursor:pointer;transition:color .12s,background .12s;}
  .fbtn:hover{background:rgba(0,0,0,.05);color:var(--foreground);}
  .fbtn.on{color:var(--accent-600);}
  .cf-pop{position:absolute;display:none;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);width:228px;padding:10px;z-index:125;}
  .cf-pop.open{display:block;}
  .cf-srch{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:8px;padding:0 10px;height:34px;}
  .cf-srch input{border:none;outline:none;font-family:inherit;font-size:13.5px;width:100%;background:transparent;}
  .cf-list{max-height:230px;overflow-y:auto;}
  .cf-pop label{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13.5px;cursor:pointer;}
  .cf-pop .cf-list label input{width:15px;height:15px;accent-color:var(--accent);}
  .cf-date{display:flex;flex-direction:column;gap:9px;}
  .cf-date label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted-foreground);padding:0;}
  .cf-date input[type=date]{border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:13px;color:var(--foreground);}
  .cf-clear{width:100%;margin-top:6px;font-size:12.5px;color:var(--muted-foreground);background:transparent;border:none;text-align:left;padding:5px 4px;cursor:pointer;border-radius:6px;}
  .cf-clear:hover{background:var(--muted);color:var(--foreground);}
  .right{text-align:right;}
  .nowrap{white-space:nowrap;}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-field);background:#fff;min-width:240px;}
  .search input{border:none;outline:none;font-family:inherit;font-size:14px;width:100%;background:transparent;}
  .select{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-field);background:#fff;font-family:inherit;font-size:14px;color:var(--foreground);}
  .seg{display:inline-flex;background:rgba(23,23,23,.06);border-radius:9px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted-foreground);}
  .seg button.active{background:#fff;color:var(--foreground);box-shadow:var(--shadow-xs);}

  /* ---------- FAQ (sheet "O que cada função faz") ---------- */
  .faq-intro{font-size:13.5px;line-height:1.55;color:#404040;margin:0 0 6px;}
  .faq-item{border-top:1px solid var(--border);}
  .faq-item:last-of-type{border-bottom:1px solid var(--border);}
  .faq-item summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:14px 2px;font-size:14.5px;font-weight:600;color:var(--foreground);}
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted-foreground);border-bottom:2px solid var(--muted-foreground);transform:rotate(45deg);transition:transform .15s;}
  .faq-item[open] summary::after{transform:rotate(-135deg);}
  .faq-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .faq-body{padding:0 2px 16px;}
  .faq-body p{margin:0 0 4px;font-size:13.5px;line-height:1.6;color:#404040;}
  .faq-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .faq-table td{padding:8px 0;border-top:1px solid var(--border);font-size:13px;vertical-align:middle;color:#404040;}
  .faq-table td.r{text-align:right;white-space:nowrap;width:1%;padding-left:10px;}
  .faq-area td{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);padding:14px 0 5px;border-top:none;}
  .faq-chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;white-space:nowrap;}
  .faq-chip.all{color:var(--all-fg);background:var(--all-bg);border:1px solid var(--all-bd);}
  .faq-chip.resp{color:var(--resp-fg);background:var(--resp-bg);border:1px solid var(--resp-bd);}

  /* ---------- Audit ---------- */
  /* ---------- Auditoria (feed) ---------- */
  #view-audit td{vertical-align:middle;}
  #view-audit th:nth-child(1),#view-audit td:nth-child(1){width:40px;}
  #view-audit th:nth-child(2){width:300px;}
  #view-audit th:nth-child(4){width:185px;}
  .audit-event{font-size:14px;color:var(--foreground);min-width:280px;}
  .audit-date{font-size:13px;color:var(--muted-foreground);white-space:nowrap;}
  .sort-th{display:inline-flex;align-items:center;gap:4px;}
  .audit-copy{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:7px;color:var(--muted-foreground);opacity:0;transition:opacity .12s,background .12s;}
  tbody tr:hover .audit-copy{opacity:1;}
  .audit-copy:hover{background:var(--muted);color:var(--foreground);}

  /* ---------- Empty state ---------- */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px;color:var(--muted-foreground);}
  .empty .ico{width:48px;height:48px;border-radius:12px;background:var(--muted);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .empty h4{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--foreground);}
  .empty p{margin:0;font-size:13.5px;max-width:340px;line-height:1.5;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,15,15,.32);backdrop-filter:blur(1px);display:flex;align-items:stretch;justify-content:flex-end;z-index:100;opacity:0;visibility:hidden;transition:opacity .22s ease;}
  .overlay.open{opacity:1;visibility:visible;}
  .sheet{position:relative;background:#fff;width:100%;max-width:440px;height:100vh;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
  .overlay.open .sheet{transform:translateX(0);}
  .sheet-x{position:absolute;top:16px;right:16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:8px;color:var(--muted-foreground);}
  .sheet-x:hover{background:var(--muted);color:var(--foreground);}
  .modal-head{padding:22px 24px 16px;border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0;font-size:18px;font-weight:700;padding-right:36px;}
  .modal-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted-foreground);}
  .modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1;}
  .field>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field input,.field select{width:100%;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-field);font-family:inherit;font-size:14px;outline:none;}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-100);}
  .field input:disabled{background:var(--muted);color:var(--muted-foreground);cursor:not-allowed;border-color:var(--border);}
  .field .hint{display:flex;gap:6px;font-size:12px;line-height:1.45;color:var(--muted-foreground);margin-top:7px;}
  .field .hint svg{flex:none;margin-top:1px;}
  .role-pick{display:flex;flex-direction:column;gap:8px;}
  .role-opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;transition:border-color .12s,background .12s;}
  .role-opt:hover{background:var(--muted);}
  .role-opt.sel{border-color:var(--accent);background:var(--accent-100);}
  .role-opt input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--accent);}
  .role-opt .rt{font-size:13.5px;font-weight:600;}
  .role-opt .rd{font-size:12px;color:var(--muted-foreground);margin-top:1px;}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fcfcfc;}
  @media(max-width:520px){.sheet{max-width:100%;}}

  /* ---------- Menu ---------- */
  .menu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:5px;min-width:188px;z-index:90;display:none;}
  .menu.open{display:block;}
  .menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:none;background:transparent;border-radius:7px;font-size:13.5px;color:var(--foreground);text-align:left;}
  .menu button:hover{background:var(--muted);}
  .menu button.danger{color:#dc2626;}
  .menu button.danger:hover{background:var(--deny-bg);}
  .menu .sep{height:1px;background:var(--border);margin:5px 0;}

  .callout{display:flex;gap:12px;padding:13px 15px;border:1px solid var(--resp-bd);background:var(--resp-bg);border-radius:10px;font-size:13px;color:#7c5310;line-height:1.5;margin-bottom:20px;}
  .callout svg{flex:none;margin-top:1px;}
  .callout b{color:#7c5310;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:all .25s;z-index:200;display:flex;align-items:center;gap:9px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .view{display:none;}
  .view.active{display:block;}
</style>

function auditArea(r){
  if(r.startsWith('org.'))return 'Organização';
  if(r.includes('technical_analysis'))return 'Análise técnica';
  if(r.startsWith('software_requirement'))return 'Requisitos de software';
  if(r.startsWith('export.'))return 'Exportação';
  if(r.startsWith('comment.'))return 'Comentários';
  if(r.startsWith('responsible.'))return 'Responsáveis';
  return 'Licitações';
}
const COLS={
  users:[
    {key:'pessoa',label:'Pessoa',type:'list',get:u=>u.n,opts:()=>users.map(u=>u.n)},
    {key:'funcao',label:'Função',type:'list',get:u=>ROLES[u.role].label,opts:()=>Object.values(ROLES).map(r=>r.label)},
    {key:'status',label:'Status',type:'list',get:u=>u.status==='invited'?'Convite pendente':'Ativo',opts:()=>['Ativo','Convite pendente']},
    {key:'ultimo',label:'Último acesso',type:'date',getDate:u=>u.lastDate},
  ],
  audit:[
    {key:'pessoa',label:'Pessoa',type:'list',get:a=>a.u,opts:()=>[...new Set(AUDIT.map(a=>a.u))]},
    {key:'evento',label:'Tipo de evento',type:'list',get:a=>auditArea(a.r),opts:()=>[...new Set(AUDIT.map(a=>auditArea(a.r)))]},
    {key:'data',label:'Data',type:'date',getDate:a=>a.ts.split(' ')[0]},
  ],
};
const colF={users:{},audit:{}};
let _cfCtx=null;
function colDef(t,k){return COLS[t].find(c=>c.key===k);}
function passColF(t,item){
  return COLS[t].every(c=>{
    const fv=colF[t][c.key];
    if(c.type==='date'){
      if(!fv||(!fv.de&&!fv.ate))return true;
      const d=c.getDate(item);
      if(!d)return false;
      return (!fv.de||d>=fv.de)&&(!fv.ate||d<=fv.ate);
    }
    if(!fv||(Array.isArray(fv)&&!fv.length))return true;
    return fv.some(x=>String(c.get(item)).toLowerCase()===String(x).toLowerCase());
  });
}
function openColFilter(e,t,k){
  e.stopPropagation();
  _cfCtx={t,k};
  const c=colDef(t,k);
  const pop=document.getElementById('colFilterPop');
  if(c.type==='date'){
    const v=colF[t][k]||{};
    pop.innerHTML=`<div class="cf-date"><label>De<input type="date" value="${v.de||''}" onchange="setDateFilter('de',this.value)"></label><label>Até<input type="date" value="${v.ate||''}" onchange="setDateFilter('ate',this.value)"></label></div><button class="cf-clear" onclick="clearColF()">Limpar filtro</button>`;
  }else{
    const sel=colF[t][k]||[];
    pop.innerHTML=`<div class="cf-list">`+c.opts().map(o=>`<label><input type="checkbox" ${sel.includes(o)?'checked':''} onchange="toggleListFilter(this,'${String(o).replace(/'/g,"&#39;")}')"> ${o}</label>`).join('')+`</div><button class="cf-clear" onclick="clearColF()">Limpar filtro</button>`;
  }
  const r=e.currentTarget.getBoundingClientRect();
  pop.style.top=(r.bottom+window.scrollY+6)+'px';
  pop.style.left=Math.min(r.left+window.scrollX, window.scrollX+window.innerWidth-244)+'px';
  pop.classList.add('open');
}
function setDateFilter(which,val){const cur=Object.assign({},colF[_cfCtx.t][_cfCtx.k]||{});cur[which]=val||undefined;colF[_cfCtx.t][_cfCtx.k]=(cur.de||cur.ate)?cur:undefined;rerender(_cfCtx.t);}
function toggleListFilter(el,o){
  const cur=colF[_cfCtx.t][_cfCtx.k]||[];
  const next=el.checked?[...cur,o]:cur.filter(x=>x!==o);
  colF[_cfCtx.t][_cfCtx.k]=next.length?next:undefined;
  rerender(_cfCtx.t);
}
function clearColF(){if(_cfCtx)colF[_cfCtx.t][_cfCtx.k]=undefined;rerender(_cfCtx?_cfCtx.t:'users');closeColFilter();}
function closeColFilter(){document.getElementById('colFilterPop').classList.remove('open');}
function rerender(t){t==='users'?renderUsers():renderAudit();}
function updateFunnels(t){document.querySelectorAll(`[data-funnel^="${t}:"]`).forEach(b=>{b.classList.toggle('on',!!colF[t][b.dataset.funnel.split(':')[1]]);});}

        <button class="row-act del" title="Remover" onclick="removeUser(${idx})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>

  const e=document.getElementById('inE').value.trim();
  const role=document.querySelector('input[name=rolepick]:checked').value;
  if(!n||!e){toast('Preencha nome e e-mail');return;}
  users.push({n,e,role,status:'invited',last:'Ainda não acessou'});
  closeModal();renderUsers();toast(`Convite enviado para ${e}`);
}

// Tabela completa das ações liberadas para uma função (fecha "ver cada recurso")
function capTable(role){
  const k=ROLE_KEY[role];
  let rows='';
  CAPS.forEach(area=>{
    const items=area.items.filter(it=>it[k]!==N);
    if(!items.length)return;
    rows+=`<tr class="faq-area"><td colspan="2">${area.area}</td></tr>`;
    items.forEach(it=>{
      const right = it[k]===R
        ? '<span class="faq-chip resp">Só as suas</span>'
        : '<span class="faq-chip all">Todas</span>';
      rows+=`<tr><td>${it.l}</td><td class="r">${right}</td></tr>`;
    });
  });
  return `<table class="faq-table"><tbody>${rows}</tbody></table>`;
}

function auditEvent(a){
  const f=AUDIT_EV[a.r]; const e=f?f(a.meta||{}):{g:a.r,inf:a.r};
  return a.granted ? e.g : `tentou ${e.inf} e o acesso foi negado (403)`;
}
function metaStr(m){return '{'+Object.entries(m||{}).map(([k,v])=>`${k}:${Array.isArray(v)?'['+v.join(',')+']':v}`).join(', ')+'}';}
// Copia o registro bruto documentado (data;userId;recurso;metadado + escopo/granted) - detalhe técnico fora da tela
function copyAudit(i){
  const a=AUDIT[i];
  const line=`${a.ts};${a.u};${a.r};${metaStr(a.meta)};scope=${a.scope||'null'};granted=${a.granted}`;
  if(navigator.clipboard) navigator.clipboard.writeText(line).catch(()=>{});
  toast('Registro copiado');
}
function cap1(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function fmtAuditDate(ts){const [d,c]=ts.split(' ');const [y,m,day]=d.split('-');return `${day}/${m}/${y} às ${c}`;}
function emailOf(name){const u=users.find(x=>x.n===name);return u?u.e:'';}
function renderAudit(){
  updateFunnels('audit');
  const q=(document.getElementById('auditSearch').value||'').toLowerCase();
  const rows=AUDIT.filter(a=>
    (!q||a.u.toLowerCase().includes(q)||auditEvent(a).toLowerCase().includes(q)||a.r.toLowerCase().includes(q))&&passColF('audit',a)
  );
  const body=document.getElementById('auditBody');
  if(!rows.length){body.innerHTML=`<tr><td colspan="4"><div class="empty"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div><h4>Nenhum registro</h4><p>Ajuste a busca para ver eventos de auditoria.</p></div></td></tr>`;return;}
  body.innerHTML=rows.map(a=>{
    const email=emailOf(a.u);
    const role=roleOf(a.u);
    const badge=role?`<span class="role-pill" style="cursor:default;pointer-events:none">${ROLES[role].label}</span>`:'';
    return `<tr>
      <td><input type="checkbox" class="rowcb" onchange="updateBulk('audit')"></td>
      <td><div><div style="display:flex;align-items:center;gap:7px"><span style="font-weight:600">${a.u}</span>${badge}</div>${email?`<div class="u-email">${email}</div>`:''}</div></td>
      <td class="audit-event">${cap1(auditEvent(a))}</td>
      <td class="audit-date">${fmtAuditDate(a.ts)}</td>
    </tr>`;
  }).join('');
  updateBulk('audit');
}

/* ============ TOAST ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ${msg}`;
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============ AÇÃO EM LOTE ============ */
let _bulkCtx='users';
function bodyOf(t){return document.getElementById(t==='users'?'usersBody':'auditBody');}
function rowCbs(t){return [...bodyOf(t).querySelectorAll('.rowcb')];}
function toggleAll(t,el){rowCbs(t).forEach(c=>c.checked=el.checked);updateBulk(t);}
function clearBulk(){rowCbs(_bulkCtx).forEach(c=>c.checked=false);updateBulk(_bulkCtx);}
function updateBulk(t){
  const cbs=rowCbs(t), n=cbs.filter(c=>c.checked).length;
  const head=document.querySelector(`#view-${t} .rowcb-all`);
  if(head){head.checked=n>0&&n===cbs.length;head.indeterminate=n>0&&n<cbs.length;}
  const bar=document.getElementById('bulkBar');
  if(n===0){bar.classList.remove('show');return;}
  _bulkCtx=t;
  const noun=t==='users'?(n===1?'pessoa selecionada':'pessoas selecionadas'):(n===1?'registro selecionado':'registros selecionados');
  document.getElementById('bbCount').textContent=`${n} ${noun}`;
  document.getElementById('bbActions').innerHTML = t==='users'
    ? `<button onclick="bulkUsers('funcao')">Mudar função</button><button onclick="bulkUsers('senha')">Resetar senha</button><button onclick="bulkUsers('remover')">Remover</button>`
    : `<button onclick="bulkAudit()">Exportar</button>`;
  bar.classList.add('show');
}
function bulkCount(t){return rowCbs(t).filter(c=>c.checked).length;}
function bulkUsers(a){
  const n=bulkCount('users'), pl=n===1?'pessoa':'pessoas';
  if(a==='senha'){toast(`Link de redefinição enviado para ${n} ${pl}`);clearBulk();}
  else if(a==='funcao'){toast(`Função atualizada para ${n} ${pl}`);clearBulk();}
  else if(a==='remover'){
    confirmAction({
      icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
      title:'Remover acesso', danger:true, okLabel:'Remover',
      msg:`Remover <b>${n}</b> ${pl} do workspace? Elas perdem o acesso imediatamente.`,
      onOk:()=>{
        const idxs=rowCbs('users').filter(c=>c.checked).map(c=>+c.dataset.idx).sort((x,y)=>y-x);
        idxs.forEach(i=>users.splice(i,1));
        renderUsers();toast(`${n} ${pl} ${n===1?'removida':'removidas'}`);
      }
    });
  }
}
function bulkAudit(){
  const n=bulkCount('audit');
  toast(`${n} ${n===1?'registro exportado':'registros exportados'} com sucesso!`);
  clearBulk();
}

/* ============ INIT ============ */
renderAudit();renderUsers();go('users');
