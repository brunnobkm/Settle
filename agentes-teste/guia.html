<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settle — Guia do teste de usabilidade</title>
  <link rel="stylesheet" href="../assets/settle.css?v=20260915-card-hover">
  <link rel="stylesheet" href="guia.css?v=1">
  <script src="guia.js?v=1" defer></script>
</head>
<body class="teste-guia">
  <main class="teste-prototipo" aria-label="Protótipo para explorar">
    <iframe id="prototipo" title="Protótipo da Settle para teste de usabilidade" src="index.html?ir=agentes"></iframe>
  </main>
  <aside class="teste-painel" aria-label="Guia do teste">
    <header class="teste-topo">
      <div><strong>Guia do teste</strong><p id="resumoEtapa">Antes de começar</p></div>
      <button id="recolher" type="button" aria-expanded="true" aria-controls="guiaConteudo">Recolher</button>
    </header>
    <div id="guiaConteudo" class="teste-conteudo">
      <div class="teste-progresso"><progress id="progresso" max="10" value="0" aria-label="Progresso do teste"></progress><span id="contador">Introdução</span></div>
      <section id="etapa" aria-labelledby="tituloEtapa">
        <p id="tipoEtapa" class="teste-tipo"></p>
        <h1 id="tituloEtapa" tabindex="-1"></h1>
        <p id="cenario"></p>
        <ol id="perguntas"></ol>
        <p id="nota" class="teste-nota" hidden></p>
      </section>
      <p class="teste-lembrete">Conte em voz alta o que está pensando. Não há resposta certa ou errada.</p>
      <footer class="teste-acoes">
        <button class="btn btn-primary" id="avancar" type="button">Começar</button>
        <button class="btn btn-outline" id="pular" type="button" hidden>Não consegui / seguir</button>
        <button id="voltar" type="button" disabled>Voltar</button>
      </footer>
      <p class="teste-privacidade">Responda falando. Este guia não grava áudio nem salva suas respostas. Recarregar esta página reinicia a sessão.</p>
    </div>
  </aside>
</body>
</html>
