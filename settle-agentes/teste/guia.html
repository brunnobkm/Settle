<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
  <meta name="google" content="notranslate">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settle — Guia do teste de usabilidade</title>
  <link rel="stylesheet" href="../../assets/settle.css?v=20260915-card-hover">
  <link rel="stylesheet" href="guia.css?v=10">
  <script src="../../assets/settle.js" defer></script>
  <script src="guia.js?v=17" defer></script>
</head>
<body class="teste-guia guia-intro">
  <main class="teste-prototipo" aria-label="Protótipo para explorar">
    <iframe id="prototipo" title="Protótipo da Settle para teste de usabilidade" src="index.html?ir=agentes"></iframe>
  </main>
  <aside class="teste-painel" role="dialog" aria-modal="true" aria-label="Guia do teste">
    <div id="guiaConteudo" class="teste-conteudo">
      <div class="teste-progresso"><progress id="progresso" max="9" value="0" aria-label="Progresso do teste"></progress><span id="contador">Introdução</span></div>
      <section id="etapa" aria-labelledby="tituloEtapa">
        <p id="tipoEtapa" class="teste-tipo"></p>
        <h1 id="tituloEtapa" tabindex="-1"></h1>
        <p id="cenario"></p>
        <fieldset id="checklistInicio" class="teste-checklist" hidden>
          <legend>Antes de começar</legend>
          <label><input type="checkbox"> <span>Leia as tarefas com atenção e responda às perguntas falando.</span></label>
          <label><input type="checkbox"> <span>Se algo não fizer sentido ou você não conseguir continuar, conte isso e use “Preciso de ajuda” na tarefa.</span></label>
          <label><input type="checkbox"> <span>Não recarregue a página durante o teste: isso reinicia a sessão e apaga o progresso.</span></label>
        </fieldset>
        <ol id="perguntas"></ol>
        <p id="nota" class="teste-nota" hidden></p>
      </section>
      <section id="ajudaTarefa" class="teste-ajuda" aria-label="Ajuda para a tarefa" hidden>
        <div id="conteudoAjuda" hidden>
          <h2 id="tituloAjuda" tabindex="-1">Uma dica para começar</h2>
          <p id="dicaAjuda"></p>
          <button class="btn btn-outline" id="verPassos" type="button" aria-expanded="false" aria-controls="passosAjuda">Ver passo a passo</button>
          <ol id="passosAjuda" hidden></ol>
        </div>
      </section>
      <footer class="teste-acoes">
        <button class="btn btn-primary" id="avancar" type="button">Começar</button>
        <button id="voltar" type="button" hidden disabled>Voltar</button>
      </footer>
    </div>
    <div id="ajudaRodape" class="teste-ajuda-rodape" hidden>
        <button class="btn btn-outline" id="pedirAjuda" type="button" aria-expanded="false" aria-controls="conteudoAjuda">Preciso de ajuda</button>
    </div>
  </aside>
</body>
</html>
